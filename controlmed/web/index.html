<style>
/* ═══════════════════════════════════════════════════════════
   Layout 01 — ControlCheck Desktop Panel

/* ── 1. CSS Custom Properties — paleta SIGO ── */
:root, :host {
  /* Sidebar — navy escuro (SIGO) */
  --color-sidebar: #0e1929 !important;
  --color-sidebar-dark: #080f1a !important;
  --color-sidebar-hover: rgba(255,255,255,.04) !important;
  --color-sidebar-active: rgba(74,144,240,.08) !important;
  --color-sidebar-text: rgba(255,255,255,.55) !important;
  --color-sidebar-text-active: #ffffff !important;
  --color-sidebar-section: rgba(255,255,255,.35) !important;
  --color-sidebar-border: rgba(255,255,255,.06) !important;

  /* Superfícies limpas */
  --color-surface: #f7f8fa !important;
  --color-surface-2: #eef0f4 !important;
  --color-card: rgba(255,255,255,.95) !important;
  --color-border: rgba(0,0,0,.07) !important;

  /* Texto */
  --color-text: #1e2d3d !important;
  --color-text-2: #5a6a7e !important;
  --color-text-3: #8a95a5 !important;

  /* Primary/accent — azul SIGO */
  --color-primary: #3d7ee0 !important;
  --color-primary-light: #4a90f0 !important;
  --color-primary-soft: rgba(61,126,224,.10) !important;
  --color-accent: #3d7ee0 !important;
  --color-accent-soft: rgba(61,126,224,.10) !important;

  /* Status */
  --color-success: #34b87a !important;
  --color-success-soft: rgba(52,184,122,.10) !important;
  --color-warning: #e8a830 !important;
  --color-warning-soft: rgba(232,168,48,.10) !important;
  --color-danger: #e05252 !important;
  --color-danger-soft: rgba(224,82,82,.08) !important;
  --color-info: #4a90f0 !important;
  --color-info-soft: rgba(74,144,240,.10) !important;
  --color-amber: #e8a830 !important;
  --color-amber-soft: rgba(232,168,48,.10) !important;

  /* Radius — moderado (SIGO) */
  --radius-md: 8px !important;
  --radius-lg: 12px !important;
  --radius-xl: 16px !important;
}

/* ── 2. Body — fundo limpo (SIGO) ── */
body {
  background: #f7f8fa !important;

/* ── 3. Sidebar — navy escuro sólido (SIGO) ── */
.bg-sidebar,
.sidebar-pattern,
[class*="bg-sidebar"]:not(.bg-sidebar-hover):not(.bg-sidebar-active):not(.bg-sidebar-border) {
  background: #0e1929 !important;
}

/* Sem pattern decorativo (SIGO é limpo) */
.sidebar-pattern::before {
  display: none !important;
}

.sidebar-pattern::after {
  background: none !important;
}

/* Sidebar — borda lateral */
.sidebar-pattern,
[class*="w-[260px]"][class*="bg-sidebar"] {
  border-right: 1px solid rgba(255,255,255,.06) !important;
  box-shadow: none !important;
}

/* Sidebar dividers */
.bg-sidebar-border {
  background-color: rgba(255,255,255,.06) !important;
}

/* Sidebar section labels — uppercase discreto (SIGO) */
.text-sidebar-section {

}

/* ── 3b. Sidebar nav items — réplica exata do SIGO ── */

/*
   SIGO: todos os itens mantêm a mesma posição de texto.
   O "pill" é criado com margin lateral + radius em TODOS,
   mas fundo transparente nos inativos — só aparece no hover/ativo.
   Assim o texto nunca pula.
*/

/* Todos os nav items: mesma posição, pill invisível por padrão */
.sidebar-pattern [class*="gap-3"][class*="cursor-pointer"],
[class*="bg-sidebar"] [class*="gap-3"][class*="cursor-pointer"] {
  font-size: 14px !important;
  line-height: 1.5 !important;

  border-radius: 8px !important;

  background: transparent !important;

}

/* Anular a borda esquerda do compilado (border-l-[3px]) */
.sidebar-pattern [class*="gap-3"][class*="border-l-"],
[class*="bg-sidebar"] [class*="gap-3"][class*="border-l-"] {
  border-left: none !important;
}
.border-l-sidebar-section {

[class*="bg-sidebar"] [class*="gap-3"][class*="cursor-pointer"]:hover,
.hover\:bg-sidebar-hover:hover {

}

/* Texto fica branco puro no hover */
.hover\:text-sidebar-text-active:hover,
.sidebar-pattern [class*="gap-3"][class*="cursor-pointer"]:hover,
.sidebar-pattern [class*="gap-3"][class*="cursor-pointer"]:hover * {
  color: #ffffff !important;
}

/* Item ativo — pill com fundo sólido, SEM borda, SEM gradiente (SIGO) */
.bg-sidebar-active {
  background: rgba(255,255,255,.08) !important;
}

[class*="border-l-sidebar-section"][class*="bg-sidebar-active"],
.sidebar-pattern [class*="bg-sidebar-active"],
[class*="bg-sidebar"] [class*="bg-sidebar-active"] {
  background: rgba(255,255,255,.08) !important;

[class*="bg-sidebar-active"] span,
[class*="bg-sidebar-active"] p {

}

/* Sub-itens sidebar (gap-2) — mesma lógica pill */

.min-h-screen.bg-surface.flex.items-center::before {
  content: "" !important;
  position: absolute !important;
  inset: 0 !important;
