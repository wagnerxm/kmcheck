<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finance Mind</title>
<meta name="theme-color" content="#0A3D2E">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finance Mind"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;src:url(vendor/manrope.woff2) format('woff2')}
/* Equivale ao esqueleto que o Claude Artifacts aplica: respiros das áreas seguras do iPhone e atributo [hidden]. */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}img{max-width:100%}
/* Layout: mobile-first em uma coluna com cabeçalho de marca, abas em cápsula e navegação flutuante de vidro;
   no desktop vira barra lateral de vidro + coluna central. Fundo com manchas orgânicas difusas (sálvia, champanhe, névoa).
   Identidade: verde-petróleo #003A3B, sálvia #A8D5B4, branco-gelo #F6F7F3, cinza-névoa #E5EAE6, champanhe #DCD6B9. */
:root{
  --petrol:#003A3B; --sage:#A8D5B4; --ice:#F6F7F3; --mist:#E5EAE6; --champ:#DCD6B9;
  --bg:#F6F7F3; --blob1:rgba(168,213,180,.75); --blob2:rgba(220,214,185,.7); --blob3:rgba(229,234,230,.9); --blob4:rgba(168,213,180,.45);
  --ink:#0B2B2C; --muted:#5B7271; --line:rgba(0,58,59,.12);
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.82); --glass-b:rgba(255,255,255,.75); --glass-sh:0 10px 34px rgba(0,58,59,.09);
  --surf:rgba(255,255,255,.62); --surf2:rgba(0,58,59,.06);
  --brand:#003A3B; --brand-ink:#F6F7F3; --brand-soft:rgba(168,213,180,.42);
  --hero1:#0A5253; --hero2:#003A3B; --hero-ink:#F6F7F3; --hero-mute:rgba(246,247,243,.72); --hero-line:rgba(246,247,243,.18);
  --rec:#2B7F5B; --dsp:#C25B5B; --rec-soft:rgba(168,213,180,.55); --dsp-soft:rgba(226,160,160,.35);
  --ok:#256B4E; --warn:#7B6420; --warn-soft:rgba(220,214,185,.7); --bad:#A94444; --bad-soft:rgba(226,160,160,.35);
  --bar-ok:#A8D5B4; --bar-warn:#E6D9A0; --bar-bad:#EBA5A0;
  --active:#FFFFFF; --nav-sh:0 14px 40px rgba(0,58,59,.18);
  --f-display:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif; --f-body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#021A1B; --blob1:rgba(0,90,88,.7); --blob2:rgba(168,213,180,.16); --blob3:rgba(0,58,59,.8); --blob4:rgba(168,213,180,.12);
  --ink:#EAF3EE; --muted:#9DB6B0; --line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.14); --glass-sh:0 10px 34px rgba(0,0,0,.35);
  --surf:rgba(255,255,255,.07); --surf2:rgba(255,255,255,.08);
  --brand:#A8D5B4; --brand-ink:#00282A; --brand-soft:rgba(168,213,180,.2);
  --hero1:#0B5658; --hero2:#00383A;
  --rec:#8ADBA9; --dsp:#EE9894; --rec-soft:rgba(168,213,180,.2); --dsp-soft:rgba(238,152,148,.2);
  --ok:#A8D5B4; --warn:#E6D9A0; --warn-soft:rgba(220,214,185,.16); --bad:#EE9894; --bad-soft:rgba(238,152,148,.18);
  --active:rgba(255,255,255,.92); --nav-sh:0 14px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#021A1B; --blob1:rgba(0,90,88,.7); --blob2:rgba(168,213,180,.16); --blob3:rgba(0,58,59,.8); --blob4:rgba(168,213,180,.12);
  --ink:#EAF3EE; --muted:#9DB6B0; --line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.14); --glass-sh:0 10px 34px rgba(0,0,0,.35);
  --surf:rgba(255,255,255,.07); --surf2:rgba(255,255,255,.08);
  --brand:#A8D5B4; --brand-ink:#00282A; --brand-soft:rgba(168,213,180,.2);
  --hero1:#0B5658; --hero2:#00383A;
  --rec:#8ADBA9; --dsp:#EE9894; --rec-soft:rgba(168,213,180,.2); --dsp-soft:rgba(238,152,148,.2);
  --ok:#A8D5B4; --warn:#E6D9A0; --warn-soft:rgba(220,214,185,.16); --bad:#EE9894; --bad-soft:rgba(238,152,148,.18);
  --active:rgba(255,255,255,.92); --nav-sh:0 14px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:radial-gradient(60% 38% at 8% 4%,var(--blob1),transparent 70%),radial-gradient(55% 40% at 100% 22%,var(--blob2),transparent 72%),radial-gradient(70% 45% at 0% 62%,var(--blob3),transparent 70%),radial-gradient(60% 40% at 100% 100%,var(--blob4),transparent 70%);
  background-attachment:fixed;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:18px;font-weight:800}h3{font-size:15px;font-weight:800}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:14px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.mut{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grow{flex:1;min-width:0}

/* vidro */
.glass,.card,.stat,.tabs,.floatnav,.side,.composer-glass,.acao-card,.sug{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3)}
.card{border-radius:28px;padding:18px;min-width:0}
.card.flat{box-shadow:none}

.app{max-width:1120px;margin:0 auto;min-height:100vh}
.side{display:none}
.pagehead{display:flex;align-items:center;gap:12px;padding:16px 0 10px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo-mind{width:42px;height:42px;display:grid;place-items:center;color:var(--petrol);flex:none}
:root[data-theme="dark"] .logo-mind{color:var(--sage)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-mind{color:var(--sage)}}
.bname{font-weight:800;font-size:17px;letter-spacing:.01em;line-height:1.1}
.btag{font-size:12.5px;color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass2);display:grid;place-items:center;color:var(--ink);box-shadow:var(--glass-sh);flex:none;transition:transform .15s}
.avatar:active{transform:scale(.94)}

main{padding-bottom:150px;min-width:0}
.page{display:flex;flex-direction:column;gap:16px;animation:in .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page,.sheet,.msg{animation:none!important}*{transition:none!important}}
.ptitle{font-size:30px;font-weight:800;margin:2px 0}
.psub{color:var(--muted);margin-top:-10px}
.tabbed .ptitle{font-size:24px}

/* abas em cápsula */
.tabs{display:flex;border-radius:999px;padding:5px;gap:2px}
.tabs button{flex:1;border:0;background:none;padding:11px 8px;border-radius:999px;font-weight:700;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--active);color:#0B2B2C;box-shadow:0 2px 10px rgba(0,58,59,.12)}

/* saudação */
.greet{padding:4px 2px 0}
.greet .oi{font-size:36px;font-weight:300;color:var(--muted);line-height:1.1;letter-spacing:-.03em}
.greet .dia{font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.greet .dia svg{color:#C9A84C;flex:none}
.greet p{color:var(--muted);margin-top:8px}

/* navegação flutuante de vidro */
.floatnav{position:fixed;z-index:45;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 28px));
  border-radius:34px;padding:8px 10px;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;box-shadow:var(--nav-sh);background:var(--glass2)}
.floatnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:24px;transition:background .2s,color .2s,transform .15s}
.floatnav button:active{transform:scale(.94)}
.floatnav button[aria-current="page"]{background:var(--active);color:#0B2B2C;box-shadow:0 3px 14px rgba(0,58,59,.16)}
.floatnav .fab{width:64px;height:64px;border-radius:50%;margin:-26px auto 0;padding:0;justify-content:center;background:var(--brand);color:var(--brand-ink);border:4px solid var(--glass-b);box-shadow:0 10px 26px rgba(0,58,59,.35)}
:root[data-theme="dark"] .floatnav .fab{box-shadow:0 10px 26px rgba(0,0,0,.5)}
.floatnav .fab:hover{filter:brightness(1.12)}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:250px minmax(0,1fr);gap:34px;padding-top:22px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:22px;align-self:start;height:calc(100vh - 44px);padding:20px 14px;border-radius:32px}
  .side .brand{padding:4px 8px 20px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:999px;font-weight:700;color:var(--muted);text-align:left;transition:background .2s}
  .side nav button:hover{background:var(--surf2)}
  .side nav button[aria-current="page"]{background:var(--active);color:#0B2B2C;box-shadow:0 3px 14px rgba(0,58,59,.12)}
  .side .btn{margin:12px 0}
  .side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px}
  .pagehead,.floatnav{display:none}
  main{padding-bottom:56px;max-width:820px}
  .toast{bottom:28px!important}
}

.secao{display:flex;flex-direction:column;gap:12px;min-width:0}
.secao-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.secao-h h2{font-size:19px}
.link{border:0;background:none;color:var(--muted);font-weight:700;padding:4px 2px;font-size:13.5px;display:inline-flex;align-items:center;gap:2px}
.link:hover{color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.g3.stk{grid-template-columns:1fr}}

/* botões em cápsula */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--glass-b);background:var(--glass2);padding:12px 20px;border-radius:999px;font-weight:700;min-height:46px;transition:transform .15s,filter .2s,background .2s}
.btn:hover{filter:brightness(1.03)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:transparent;color:var(--brand-ink);box-shadow:0 8px 22px rgba(0,58,59,.25)}
.btn.big{width:100%;font-size:16.5px;min-height:56px}
.btn.ghost{background:none;box-shadow:none}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.sm{min-height:38px;padding:8px 16px;font-size:14px}
.btn.light{background:rgba(246,247,243,.9);color:#003A3B;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--glass-b);background:var(--glass2);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.solid{background:var(--brand);color:var(--brand-ink);border-color:transparent;width:50px;height:50px;box-shadow:0 8px 22px rgba(0,58,59,.3)}

/* cartão principal verde-petróleo */
.hero,.metahero{background:linear-gradient(145deg,var(--hero1),var(--hero2) 70%);color:var(--hero-ink);border-radius:30px;padding:20px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,58,59,.28);border:1px solid rgba(255,255,255,.12)}
.hero::after,.metahero::after{content:"";position:absolute;inset:-30% -20% auto auto;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(168,213,180,.28),transparent 65%);pointer-events:none}
.hero>*,.metahero>*{position:relative;z-index:1}
.hero .lbl,.metahero .lbl{font-size:14px;color:var(--hero-mute);font-weight:600;display:flex;align-items:center;gap:7px}
.bignum{font-weight:800;font-size:46px;letter-spacing:-.04em;line-height:1.05;display:block}
.bignum small{font-size:.5em;font-weight:700;letter-spacing:-.01em;opacity:.85}
.bignum small:first-child{margin-right:.2em}
.hero .sub,.metahero .sub{font-size:13.5px;color:var(--hero-mute)}
.walleticon{width:48px;height:48px;border-radius:16px;background:rgba(246,247,243,.14);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.bar{height:11px;border-radius:99px;background:rgba(246,247,243,.2);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--bar-ok);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar i.warn{background:var(--bar-warn)}.bar i.bad{background:var(--bar-bad)}
.bar.lt{background:var(--surf2)}
.bar.lt i{background:linear-gradient(90deg,var(--sage),#7FBF98)}
.bar.lt i.warn{background:var(--champ)}.bar.lt i.bad{background:#E0A19D}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;background:rgba(246,247,243,.16);color:var(--hero-ink)}
.stat{border-radius:26px;padding:14px 16px;min-width:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-weight:800;font-size:19px;margin-top:2px;overflow-wrap:anywhere;letter-spacing:-.02em}
.stat .s{font-size:12px;color:var(--muted)}
.v.rec{color:var(--rec)}.v.dsp{color:var(--dsp)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .stat{display:flex;align-items:center;gap:10px;padding:12px 12px}
.duo .stat .v{font-size:16.5px;white-space:nowrap}
.duo .stat .k{font-size:12.5px}
.duo .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.duo .ico.r{background:var(--rec-soft);color:var(--rec)}.duo .ico.d{background:var(--dsp-soft);color:var(--dsp)}
@media (max-width:380px){.duo{grid-template-columns:1fr}}

.catsrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.catbtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px;text-align:center;min-width:0}
.catbtn .c{width:58px;height:58px;border-radius:22px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);color:var(--ink);transition:transform .15s}
.catbtn:active .c{transform:scale(.93)}
.catbtn .n{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.catbtn .vv{font-size:12.5px;font-weight:700}

.acao-card{display:flex;align-items:center;gap:14px;border-radius:28px;padding:14px 14px 14px 16px;width:100%;text-align:left;transition:transform .15s}
.acao-card:active{transform:scale(.985)}
.acao-card .t{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;flex:none;border:1px solid var(--line);background:var(--glass2)}
.acao-card .k{font-size:12.5px;color:var(--muted);font-weight:600}
.acao-card .h{font-weight:800;font-size:17.5px;letter-spacing:-.02em;line-height:1.25}
.acao-card .d{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acao-card .go{width:42px;height:42px;border-radius:50%;background:var(--glass2);border:1px solid var(--glass-b);display:grid;place-items:center;flex:none}

.meta-mini{display:flex;flex-direction:column;gap:4px}
.meta-mini .t{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--surf2);color:var(--muted)}
.badge.ok{background:var(--rec-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}

/* meta principal */
.metahero .top{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px}
.metahero .top .walleticon{width:44px;height:44px;border-radius:50%}
.metahero .mid{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 4px}
.ringS{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--sage) calc(var(--p)*1%),rgba(246,247,243,.18) 0);display:grid;place-items:center;flex:none;transition:--p 1s}
.ringS::before{content:"";grid-area:1/1;width:64px;height:64px;border-radius:50%;background:var(--hero2)}
.ringS b{grid-area:1/1;z-index:1;font-size:18px;font-weight:800}
.metahero .foot{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--hero-mute);margin-bottom:14px}
.metahero .chipc{display:inline-flex;gap:6px;align-items:center;background:rgba(246,247,243,.14);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;margin-bottom:12px}
.metahero .btn{width:100%}
.metarow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border-radius:28px;padding:14px;border:1px solid var(--glass-b);background:var(--glass);box-shadow:var(--glass-sh);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.metarow .t{width:54px;height:54px;border-radius:20px;background:linear-gradient(145deg,var(--champ),var(--mist));display:grid;place-items:center;flex:none;color:#003A3B}
.metarow .n{font-weight:800}

.daydots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.daydots span{font-size:12px;color:var(--muted);font-weight:700}
.daydots i{width:34px;height:34px;border-radius:50%;margin:5px auto 0;display:grid;place-items:center;background:var(--surf2);color:transparent}
.daydots i.on{background:var(--sage);color:#003A3B}
.daydots i.hoje{outline:2px solid var(--brand);outline-offset:2px}

/* listas e itens */
.lista{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.dot{width:38px;height:38px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff}
.item .mid{flex:1;min-width:0}
.item .t,.item .d{display:block}
.item .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{font-weight:800;white-space:nowrap}.val.rec{color:var(--rec)}
.pago{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;flex:none;padding:0;transition:background .2s,border-color .2s}

<script>
/* ===== LÓGICA PURA (sem DOM) — valores sempre em centavos inteiros ===== */
const MOEDA = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = c => MOEDA.format((c || 0) / 100);
const numBR = c => ((c || 0) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const compacto = c => { const r = c / 100; return r >= 1000 ? 'R$ ' + (r / 1000).toFixed(r >= 10000 ? 0 : 1).replace('.', ',') + ' mil' : 'R$ ' + Math.round(r); };
const soma = (arr, f = x => x) => arr.reduce((a, x) => a + f(x), 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MESC = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

const diasMes = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addDias = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return isoDate(d); };
const difDias = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);

const fimMes = ym => `${ym}-${pad(diasMes(ym))}`;
const fmtData = s => `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}`;
const fmtDM = s => `${s.slice(8, 10)}/${s.slice(5, 7)}`;
const nomeMes = ym => `${MESES[+ym.slice(5, 7) - 1]} de ${ym.slice(0, 4)}`;
const mesCurto = ym => MESC[+ym.slice(5, 7) - 1];
const rotuloDia = (s, h) => s === h ? 'Hoje' : s === addDias(h, -1) ? 'Ontem' : `${DIAS[parseISO(s).getDay()]}, ${fmtDM(s)}`;

// Converte "1.234,56", "R$ 12,5", "12.50" em centavos. NaN quando inválido.
function parseMoeda(str) {
  const s = String(str == null ? '' : str).replace(/[R$\s]/g, '');
  if (!s || !/^[\d.,]+$/.test(s)) return NaN;
  const v = s.lastIndexOf(','), p = s.lastIndexOf('.');
  let int = s, dec = '0';
  if (v > -1 && v > p) { int = s.slice(0, v); dec = s.slice(v + 1); }
  else if (v === -1 && p > -1 && s.length - p - 1 <= 2) { int = s.slice(0, p); dec = s.slice(p + 1); }
  int = int.replace(/[.,]/g, '');
  if (dec.length > 2 || !/^\d*$/.test(int) || !/^\d*$/.test(dec)) return NaN;
  return parseInt(int || '0', 10) * 100 + parseInt((dec + '00').slice(0, 2), 10);
}
// Divide em n parcelas sem perder centavos: as primeiras levam a sobra.
function dividir(total, n) {
  const base = Math.floor(total / n), resto = total - base * n;
  return Array.from({ length: n }, (_, i) => base + (i < resto ? 1 : 0));
}

/* ----- estado ----- */
const PALETA = ['#0B9E6E', '#2C8BD6', '#7A5AF0', '#E0527A', '#E8892B', '#C9A227', '#1FA6A0', '#8A9A5B', '#6B7C93', '#B05FD0'];

const PERFIL_PADRAO = [
  'Confio na minha capacidade de prosperar',
  'Tenho dificuldade de saber por onde começar a organizar as finanças',
  'Costumo gastar acima do que gostaria',

  'Acredito que mereço e posso crescer financeiramente'
];
const CATS_PADRAO = [
  { id: 'c_moradia', nome: 'Moradia', tipo: 'despesa', gasto: 'essencial', cor: 0 },
  { id: 'c_mercado', nome: 'Mercado', tipo: 'despesa', gasto: 'essencial', cor: 7 },
  { id: 'c_contas', nome: 'Contas e serviços', tipo: 'despesa', gasto: 'essencial', cor: 1 },
  { id: 'c_transp', nome: 'Transporte', tipo: 'despesa', gasto: 'essencial', cor: 6 },
  { id: 'c_saude', nome: 'Saúde', tipo: 'despesa', gasto: 'essencial', cor: 3 },
  { id: 'c_educ', nome: 'Educação', tipo: 'despesa', gasto: 'essencial', cor: 2 },
  { id: 'c_rest', nome: 'Restaurantes e delivery', tipo: 'despesa', gasto: 'flexivel', cor: 4 },
  { id: 'c_lazer', nome: 'Lazer', tipo: 'despesa', gasto: 'flexivel', cor: 9 },
  { id: 'c_compras', nome: 'Compras', tipo: 'despesa', gasto: 'flexivel', cor: 5 },
  { id: 'c_assin', nome: 'Assinaturas', tipo: 'despesa', gasto: 'flexivel', cor: 8 },
  { id: 'c_cuid', nome: 'Cuidados pessoais', tipo: 'despesa', gasto: 'flexivel', cor: 3 },
  { id: 'c_outros', nome: 'Outros', tipo: 'despesa', gasto: 'flexivel', cor: 8, fixa: true },
  { id: 'c_meta', nome: 'Aportes em metas', tipo: 'despesa', gasto: 'meta', cor: 0, oculta: true, fixa: true },
  { id: 'r_salario', nome: 'Salário', tipo: 'receita', gasto: 'flexivel', cor: 0 },
  { id: 'r_extra', nome: 'Renda extra', tipo: 'receita', gasto: 'flexivel', cor: 6 },
  { id: 'r_outras', nome: 'Outras receitas', tipo: 'receita', gasto: 'flexivel', cor: 8, fixa: true }
];
const estadoInicial = () => ({
  v: 1, criadoEm: hoje(), atualizadoEm: 0,
  cfg: { tema: 'claro', rendaMensal: 0, saldoInicial: 0, guardarMes: null, orcFlex: null, pequeno: 3000, simples: false, onboard: false },
  cats: CATS_PADRAO.map(c => ({ ...c, limite: 0 })),
  tx: [], recs: [], metas: [], espera: [], economizado: 0,
  hab: { dias: {}, semanas: {}, metasMes: {}, desafio: null, desafiosFeitos: [] },
  perfil: { tracos: [...PERFIL_PADRAO], notas: '' },
  mentor: []
});
const catMap = S => Object.fromEntries(S.cats.map(c => [c.id, c]));
const nomeCat = (S, id) => (catMap(S)[id] || {}).nome || 'Sem categoria';

/* ----- importação / validação ----- */
const inteiroPos = v => Number.isInteger(v) && v > 0 && v < 1e12 ? v : 0;
function normalizarEstado(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('O arquivo não parece um backup do Finance Mind.');
  const avisos = [], base = estadoInicial();
  const S = { ...base, criadoEm: dataValida(raw.criadoEm) ? raw.criadoEm : base.criadoEm, atualizadoEm: Date.now() };
  const cf = raw.cfg && typeof raw.cfg === 'object' ? raw.cfg : {};
  S.cfg = {
    tema: cf.tema === 'escuro' ? 'escuro' : 'claro', // fundo claro por padrão, sem seguir o modo escuro do aparelho
    rendaMensal: inteiroPos(cf.rendaMensal), saldoInicial: Number.isInteger(cf.saldoInicial) && Math.abs(cf.saldoInicial) < 1e12 ? cf.saldoInicial : 0,
    guardarMes: cf.guardarMes == null ? null : (Number.isInteger(cf.guardarMes) && cf.guardarMes >= 0 ? cf.guardarMes : null),
    orcFlex: cf.orcFlex == null ? null : (Number.isInteger(cf.orcFlex) && cf.orcFlex >= 0 ? cf.orcFlex : null),
    pequeno: inteiroPos(cf.pequeno) || 3000, simples: !!cf.simples, onboard: !!cf.onboard
  };
  if (Array.isArray(raw.cats)) {
    const vistos = new Set(), cats = [];
    for (const c of raw.cats) {
      if (!c || typeof c.id !== 'string' || typeof c.nome !== 'string' || vistos.has(c.id)) continue;
      if (!['despesa', 'receita'].includes(c.tipo)) continue;
      vistos.add(c.id);
      cats.push({ id: c.id, nome: c.nome.slice(0, 40) || 'Categoria', tipo: c.tipo, gasto: ['essencial', 'flexivel', 'meta'].includes(c.gasto) ? c.gasto : 'flexivel', cor: Number.isInteger(c.cor) ? c.cor : 0, limite: inteiroPos(c.limite), oculta: !!c.oculta, fixa: !!c.fixa });
    }

  S.tx = [];

    if (!t || typeof t !== 'object') return;
    const valor = inteiroPos(t.valor);

    let id = typeof t.id === 'string' && t.id && !ids.has(t.id) ? t.id : uid() + i;
    ids.add(id);
    let catId = cm[t.catId] && cm[t.catId].tipo === t.tipo ? t.catId : (t.tipo === 'receita' ? 'r_outras' : 'c_outros');
    const n = { id, tipo: t.tipo, valor, data: t.data, catId, desc: String(t.desc || '').slice(0, 120), pago: t.pago !== false, planejado: t.planejado !== false };

    if (t.parc && Number.isInteger(t.parc.n) && Number.isInteger(t.parc.total)) n.parc = { n: t.parc.n, total: t.parc.total };
    if (typeof t.recId === 'string') n.recId = t.recId;
    if (dataValida(t.cr)) n.cr = t.cr;

  if (planejada) { risco -= 1; mot.push({ n: 'ok', t: 'Estava planejada.' }); } else { risco += 1; mot.push({ n: 'warn', t: 'Não estava planejada.' }); }
  if (compromete === 'sim') { risco += 3; mot.push({ n: 'bad', t: 'Você indicou que compromete despesas essenciais ou metas.' }); }
  else if (compromete === 'talvez') { risco += 1; mot.push({ n: 'warn', t: 'Você não tem certeza se compromete despesas essenciais ou metas.' }); }
  if (motivo === 'impulso' && !planejada) { risco += 1; mot.push({ n: 'warn', t: 'O motivo é impulso ou promoção. Esperar um dia costuma mostrar se o desejo continua.' }); }

  return { veredito, titulo, mot, saldoLivre, disp: O.disp, definido: O.definido, essencial };
}

/* ----- relatórios ----- */
function relatorio(S, ini, fim, hojeS) {
  const cm = catMap(S), dias = difDias(fim, ini) + 1, iniAnt = addDias(ini, -dias), fimAnt = addDias(ini, -1);
  const agrega = (a, b) => {
    const r = { rec: 0, dsp: 0, porCat: {}, naoPlan: 0, naoPlanItens: [], guardado: 0 };
    for (const t of periodoTx(S, a, b)) {
      if (t.tipo === 'receita') { r.rec += t.valor; continue; }
      const g = (cm[t.catId] || {}).gasto;
      if (g === 'meta') { r.guardado += t.valor; continue; }
      r.dsp += t.valor; r.porCat[t.catId] = (r.porCat[t.catId] || 0) + t.valor;
      if (t.planejado === false) { r.naoPlan += t.valor; r.naoPlanItens.push(t); }
    }
    r.naoPlanItens.sort((x, y) => y.valor - x.valor);
    return r;
  };
  const A = agrega(ini, fim), B = agrega(iniAnt, fimAnt);
  const cats = Object.keys({ ...A.porCat, ...B.porCat }).map(id => ({ id, v: A.porCat[id] || 0, ant: B.porCat[id] || 0 })).sort((x, y) => y.v - x.v);
  const aportes = soma(S.metas.flatMap(m => m.aportes.filter(a => a.data >= ini && a.data <= fim)), a => a.valor);
  const concluidas = S.metas.filter(m => m.concluidaEm && m.concluidaEm >= ini && m.concluidaEm <= fim);
  const fimEf = fim < hojeS ? fim : hojeS, diasPeriodo = Math.max(1, difDias(fimEf, ini) + 1);
  const ativos = [...diasAtivos(S)].filter(d => d >= ini && d <= fimEf).length;
  const revisoes = Object.entries(S.hab.semanas).filter(([k, v]) => v && v.feita && k >= segunda(ini) && k <= fim).length;
  const recomend = [];
  if (A.rec > 0 && A.dsp > A.rec) recomend.push(`As despesas superaram as receitas em ${fmt(A.dsp - A.rec)}. Escolha uma categoria flexível e reduza uns 10% no próximo período.`);
  const sobe = cats.filter(c => c.v - c.ant >= 5000 && c.ant > 0 && c.v >= c.ant * 1.2)[0];
  if (sobe) recomend.push(`${nomeCat(S, sobe.id)} subiu ${fmt(sobe.v - sobe.ant)} em relação ao período anterior. Vale olhar o que mudou.`);
  if (A.dsp > 0 && A.naoPlan * 100 / A.dsp >= 25) recomend.push(`${Math.round(A.naoPlan * 100 / A.dsp)}% das despesas foram não planejadas. Use a lista de espera de 24h para compras desse tipo.`);
  if (ativos * 100 / diasPeriodo < 50) recomend.push('O acompanhamento ficou em menos da metade dos dias. Escolha um horário fixo de 3 minutos, por exemplo depois do almoço.');
  if (S.metas.some(m => m.atual < m.alvo) && aportes === 0) recomend.push('Nenhum aporte em metas no período. Mesmo um valor pequeno mantém a meta andando.');
  if (!recomend.length) recomend.push(A.dsp + A.rec === 0 ? 'Sem registros no período. Comece registrando o próximo gasto.' : 'Sem alertas neste período. Mantenha o ritmo e a regularidade dos registros.');
  return { ini, fim, dias, A, B, cats, aportes, concluidas, ativos, diasPeriodo, revisoes, recomend };
}

/* ----- CSV ----- */
function csvExportar(S) {
  const cm = catMap(S), esc = v => /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const linhas = [['data', 'tipo', 'valor', 'categoria', 'descricao', 'pago', 'planejado'].join(';')];
  [...S.tx].sort((a, b) => a.data.localeCompare(b.data)).forEach(t => linhas.push([t.data, t.tipo, numBR(t.valor).replace(/\./g, ''), esc((cm[t.catId] || {}).nome || ''), esc(t.desc || ''), t.pago ? 'sim' : 'nao', t.planejado === false ? 'nao' : 'sim'].join(';')));
  return '﻿' + linhas.join('\r\n');
}
function csvLinhas(texto) {
  const t = texto.replace(/^﻿/, ''), delim = (t.split('\n')[0].match(/;/g) || []).length >= (t.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const linhas = []; let campo = '', lin = [], asp = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (asp) { if (ch === '"') { if (t[i + 1] === '"') { campo += '"'; i++; } else asp = false; } else campo += ch; }
    else if (ch === '"') asp = true;
    else if (ch === delim) { lin.push(campo); campo = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; lin.push(campo); campo = ''; if (lin.some(x => x.trim())) linhas.push(lin); lin = []; }
    else campo += ch;
  }
  lin.push(campo); if (lin.some(x => x.trim())) linhas.push(lin);
  return linhas;
}
function csvImportar(S, texto, hojeS) {
  const linhas = csvLinhas(texto), erros = [];
  if (linhas.length < 2) throw new Error('O CSV precisa de um cabeçalho e ao menos uma linha.');
  const cab = linhas[0].map(x => normDesc(x).replace(/ /g, ''));
  const col = n => cab.indexOf(n), iD = col('data'), iT = col('tipo'), iV = col('valor'), iC = col('categoria'), iDs = Math.max(col('descricao'), col('desc')), iP = col('pago'), iPl = col('planejado');
  if (iD < 0 || iV < 0) throw new Error('O CSV precisa ter ao menos as colunas "data" e "valor".');
  const novasCats = [], cats = [...S.cats], tx = [];
  linhas.slice(1).forEach((l, i) => {
    const n = i + 2; let data = (l[iD] || '').trim();
    const m = data.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (m) data = `${m[3]}-${m[2]}-${m[1]}`;
    if (!dataValida(data)) return erros.push(`Linha ${n}: data inválida (“${l[iD] || ''}”).`);
    const bruto = (l[iV] || '').trim(), neg = bruto.startsWith('-'), valor = parseMoeda(bruto.replace('-', ''));
    if (!(valor > 0)) return erros.push(`Linha ${n}: valor inválido (“${bruto}”).`);
    const tt = iT >= 0 ? normDesc(l[iT]) : '';
    const tipo = /^r|entrada|recei/.test(tt) ? 'receita' : /^d|saida|desp/.test(tt) ? 'despesa' : (neg ? 'despesa' : 'receita');
    const nome = ((iC >= 0 ? l[iC] : '') || '').trim();
    let cat = cats.find(c => c.tipo === tipo && c.nome.toLowerCase() === nome.toLowerCase());
    if (!cat) {
      if (nome) { cat = { id: 'c_' + uid(), nome: nome.slice(0, 40), tipo, gasto: 'flexivel', cor: cats.length % 10, limite: 0 }; cats.push(cat); novasCats.push(cat); }
      else cat = cats.find(c => c.id === (tipo === 'receita' ? 'r_outras' : 'c_outros'));
    }
    tx.push({ id: 'i_' + uid() + i, tipo, valor, data, catId: cat.id, desc: ((iDs >= 0 ? l[iDs] : '') || '').trim().slice(0, 120), pago: iP >= 0 ? !/^(n|0|f)/i.test((l[iP] || 'sim').trim()) : data <= hojeS, planejado: iPl >= 0 ? !/^(n|0|f)/i.test((l[iPl] || 'sim').trim()) : true, cr: hojeS });
  });
  return { tx, novasCats, erros };
}

function montarPrompt(S, hojeS, hist, demo) {

  return `Você é o Mentor do FINANCE MIND, um app pessoal de finanças e hábitos. Responda sempre em português do Brasil, em tom acolhedor, direto e sem julgamento.

PERFIL (autorrelato do usuário)
${S.perfil.tracos.map(t => '- ' + t).join('\n') || '- (não informado)'}${S.perfil.notas ? '\nNotas do usuário: ' + S.perfil.notas : ''}

${JSON.stringify(contextoMentor(S, hojeS, demo))}

CONVERSA
${conversa}

MENTOR:`;
}

function lerLocal() {
  try { const r = localStorage.getItem(CHAVE); if (!r) return null; return normalizarEstado(JSON.parse(r)).estado; } catch (e) { return null; }

/* ----- ações puras sobre o estado ----- */
const marca = (s, d, k) => ({ ...s, hab: { ...s.hab, dias: { ...s.hab.dias, [d]: { ...(s.hab.dias[d] || {}), [k]: true } } } });
function removerTx(s, t, escopo) {
  let ids = new Set([t.id]), recs = s.recs;
  const rec = t.recId ? s.recs.find(r => r.id === t.recId) : null;
  if (t.grupoId && escopo !== 'uma') s.tx.forEach(x => { if (x.grupoId === t.grupoId && (escopo === 'todas' || x.data >= t.data)) ids.add(x.id); });
  if (rec) {
    const ym = ymOf(t.data);
    if (escopo === 'proximas') {
      s.tx.forEach(x => { if (x.recId === rec.id && x.data >= t.data) ids.add(x.id); });
      const fim = addMes(ym, -1);
      recs = fim < rec.inicio ? s.recs.filter(r => r.id !== rec.id) : s.recs.map(r => r.id === rec.id ? { ...r, fim } : r);
    } else recs = s.recs.map(r => r.id === rec.id ? { ...r, pulos: [...(r.pulos || []), ym] } : r);
  }
  const removidos = s.tx.filter(x => ids.has(x.id));
  return { estado: { ...s, tx: s.tx.filter(x => !ids.has(x.id)), recs }, removidos, recsAntes: s.recs };
}

  }, [A.cfg.tema]);

  // armazenamento pessoal: banco privado do usuário (data/users/<id>) + cópia local
  useEffect(() => {
    let vivo = true;
    (async () => {
      const [user, db] = [await usar('user'), await usar('db')];
      if (!vivo || !user || !db) return;
      try {
        const id = await user.id(); if (!id) return;
        const ref = db.collection('data/users/' + id).doc('estado');
        r.current.ref = ref;
        const snap = await ref.get();
        const local = lerLocal();
        if (snap.exists) {
          const d = snap.data() || {};
          if (typeof d.json === 'string' && (!local || (d.atualizadoEm || 0) > (local.atualizadoEm || 0))) {
            const rem = normalizarEstado(JSON.parse(d.json)).estado; rem.atualizadoEm = d.atualizadoEm || rem.atualizadoEm;
            if (vivo) { setS(rem); gravarLocal(rem); }
          } else if (local && (local.atualizadoEm || 0) > (d.atualizadoEm || 0)) await ref.set({ json: JSON.stringify(local), atualizadoEm: local.atualizadoEm });
        } else if (local && local.tx.length) await ref.set({ json: JSON.stringify(local), atualizadoEm: local.atualizadoEm || Date.now() });
        if (vivo) setStatus({ modo: 'nuvem', msg: 'Salvo na sua conta (privado, só você lê) e neste navegador.' });
      } catch (e) { if (vivo) setStatus({ modo: 'local', msg: 'Salvo neste navegador. O armazenamento na conta não está disponível agora.' }); }
    })();
    return () => { vivo = false; };
  }, []);

  useEffect(() => {
    if (r.current.primeira) { r.current.primeira = false; return; }
    if (demo) return;
    // cópia local na hora (barata): fechar o app logo após registrar não perde nada; só a conta é gravada com atraso
    if (!gravarLocal(S)) setStatus(s => ({ ...s, msg: 'Atenção: este navegador bloqueou o salvamento local. Exporte um backup.' }));
    clearTimeout(r.current.timer);
    r.current.timer = setTimeout(async () => {
      if (r.current.ref) {
        try {
          const json = JSON.stringify(S);
          if (json.length > 230000) throw new Error('grande');
          await r.current.ref.set({ json, atualizadoEm: S.atualizadoEm });
        } catch (e) { setStatus({ modo: 'local', msg: e.message === 'grande' ? 'Os dados passaram do limite da conta; seguem salvos neste navegador. Exporte um backup.' : 'Salvo neste navegador. Não consegui salvar na conta agora.' }); }
      }
    }, 500);
  }, [S, demo]);

  const ctx = {
    A, S, demo, upd, hojeS, rota, aba, setAba: (r, a) => setAbas(s => ({ ...s, [r]: a })), toast,
    // aceita os nomes antigos das telas e leva para a aba certa

    abrir: (k, d) => setSheet({ k, d: d || {} }), fechar: () => setSheet(null), sheet,
    entrarDemo: () => { setDemo(estadoDemo(hojeS)); setRota('inicio'); },
    sairDemo: () => setDemo(null),
    substituir: novo => setS({ ...novo, atualizadoEm: Date.now() }),
    toastMsg, fecharToast: () => setToastMsg(null)
  };
  return html`<${Ctx.Provider} value=${ctx}>${children}<//>`;
}

function Md({ texto }) {
  const blocos = []; let lista = null;
  const inl = (t, k) => t.split(/(\*\*[^*]+\*\*)/g).map((p, i) => /^\*\*[^*]+\*\*$/.test(p) ? html`<strong key=${k + '-' + i}>${p.slice(2, -2)}</strong>` : p);
  String(texto || '').split('\n').forEach(l => {
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m) { if (!lista) { lista = []; blocos.push({ lista }); } lista.push(m[1]); }
    else { lista = null; if (l.trim()) blocos.push({ p: l.replace(/^#+\s*/, '') }); }
  });
  return html`<div className="md">${blocos.map((b, i) => b.lista ? html`<ul key=${i}>${b.lista.map((x, j) => html`<li key=${j}>${inl(x, i + '-' + j)}</li>`)}</ul>` : html`<p key=${i}>${inl(b.p, i)}</p>`)}</div>`;
}

/* ----- gráfico de evolução mensal ----- */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function GraficoEvolucao({ serie, sel, onSel }) {
  const W = 340, H = 176, L = 46, B = 24, T = 8, max = niceMax(Math.max(100, ...serie.flatMap(m => [m.recTotal, m.dspTotal])));
  const y = v => T + (H - T - B) * (1 - v / max), w = (W - L) / serie.length, bw = Math.min(18, w / 2 - 4);
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Receitas e despesas dos últimos 6 meses">
    ${[0, 0.5, 1].map(f => html`<g key=${f}><line className="gl" x1=${L} x2=${W} y1=${y(max * f)} y2=${y(max * f)} /><text x=${L - 6} y=${y(max * f) + 3.5} textAnchor="end">${f === 0 ? 'R$ 0' : compacto(max * f)}</text></g>`)}
    ${serie.map((m, i) => { const cx = L + w * i + w / 2; return html`<g key=${m.ym} className=${'grp' + (m.ym === sel ? ' sel' : '')} onClick=${() => onSel(m.ym)} role="button" tabIndex="0" aria-label=${`${nomeMes(m.ym)}: receitas ${fmt(m.recTotal)}, despesas ${fmt(m.dspTotal)}`} onKeyDown=${e => { if (e.key === 'Enter' || e.key === ' ') onSel(m.ym); }}>
      <rect className="bg" x=${cx - w / 2 + 2} y=${T} width=${w - 4} height=${H - T} rx="8" fill="transparent" />
      <rect x=${cx - bw - 1} y=${y(m.recTotal)} width=${bw} height=${Math.max(0, H - B - y(m.recTotal))} rx="3" fill="var(--rec)" />
      <rect x=${cx + 1} y=${y(m.dspTotal)} width=${bw} height=${Math.max(0, H - B - y(m.dspTotal))} rx="3" fill="var(--dsp)" />
      <text x=${cx} y=${H - 7} textAnchor="middle">${mesCurto(m.ym)}</text></g>`; })}
  </svg>`;
}

/* ===== SHEET: lançamento ===== */
function sugestoes(A, tipo) {
  const vistos = new Set(), out = [];
  [...A.tx].filter(t => t.tipo === tipo && !t.recId && !t.grupoId).sort((a, b) => (b.cr || b.data).localeCompare(a.cr || a.data)).forEach(t => {
    const k = normDesc(t.desc) + '|' + t.catId + '|' + t.valor;
    if (!vistos.has(k) && out.length < 4) { vistos.add(k); out.push(t); }
  });
  return out;
}
function SheetLanc({ init }) {
  const { A, upd, fechar, toast, hojeS, ir } = useApp();
  const edit = !!init.id, orig = edit ? A.tx.find(t => t.id === init.id) : null;

  const [apagar, setApagar] = useState(false);
  const cats = A.cats.filter(c => c.tipo === tipo && !c.oculta);
  const trocaTipo = t => { setTipo(t); setCatId(catSug(t)); setParc(1); setRec(false); };
  const pagoFinal = pago != null ? pago : data <= hojeS;
  const sug = edit ? [] : sugestoes(A, tipo);

  const salvar = () => {
    const c = A.cats.find(x => x.id === catId && x.tipo === tipo);
    if (!(valor > 0)) return setErro('Informe um valor maior que zero.');
    if (!dataValida(data)) return setErro('A data não é válida.');
    if (!c) return setErro('Escolha uma categoria.');
    const base = { tipo, catId, desc: desc.trim().slice(0, 120), planejado: tipo === 'despesa' ? plan : true };
    if (edit) {
      upd(s => ({ ...s, tx: s.tx.map(t => t.id === init.id ? { ...t, ...base, valor, data, pago: pagoFinal } : t) }));
      toast('Alterações salvas'); return fechar();
    }
    let msg;
    if (tipo === 'despesa' && parc > 1) {
      const gid = uid(), partes = dividir(valor, parc);
      upd(s => marca({ ...s, tx: [...s.tx, ...partes.map((v, i) => { const d = `${addMes(ymOf(data), i)}-${pad(Math.min(+data.slice(8, 10), diasMes(addMes(ymOf(data), i))))}`; return { id: uid() + i, ...base, valor: v, data: d, pago: d <= hojeS, grupoId: gid, parc: { n: i + 1, total: parc }, cr: hojeS }; })] }, hojeS, 'reg'));
      msg = `Compra parcelada em ${parc}x registrada`;

    fechar();
    toast('Lançamento excluído', () => upd(s => ({ ...s, tx: [...s.tx, ...res.removidos], recs: res.recsAntes })));

  const salvarRef = useRef(salvar); salvarRef.current = salvar;
  return html`<${Sheet} titulo=${edit ? 'Editar lançamento' : 'Registrar'} onClose=${fechar}>

function SheetAporte({ init }) {
  const { A, upd, fechar, toast, hojeS } = useApp();

      if (desc) ns.tx = [...s.tx, { id: txId, tipo: 'despesa', valor, data, catId: 'c_meta', desc: m.nome, pago: true, planejado: true, cr: hojeS }];
      return marca(ns, hojeS, 'reg');
    });

/* ----- Dados e ajustes ----- */
async function salvarArquivo(nome, dados) {
  try {
    const dl = await usar('downloads');
    if (dl) { await dl.save({ filename: nome, data: dados }); return 'ok'; }
    if (MENTOR) return 'indisponivel';
    // PWA/navegador comum: link com blob (no iOS abre a folha de compartilhar/salvar)
    const url = URL.createObjectURL(new Blob([dados], { type: /\.json$/.test(nome) ? 'application/json' : 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return 'ok';
  }
  catch (e) { return e && e.code === 'declined' ? 'recusado' : 'erro'; }
}

    <section className="card stack"><h2>Exportar</h2>
      <button className="btn" disabled=${!!demo} onClick=${() => exportar(`financemind-backup-${hojeS}.json`, JSON.stringify(S, null, 1))}><${Ico} n="down" s=${18} />Backup completo (JSON)</button>

      ${saida ? html`<div className="stack"><div className="note">Não consegui abrir o salvamento neste ambiente. Copie o texto abaixo e salve num arquivo ${saida.nome.split('.').pop().toUpperCase()}.</div><pre className="out">${saida.texto.slice(0, 60000)}</pre><button className="btn sm" onClick=${async () => { try { await navigator.clipboard.writeText(saida.texto); toast('Copiado'); } catch (e) { toast('Selecione o texto e copie manualmente'); } }}>Copiar tudo</button></div>` : null}</section>

// Número que "rola" até o novo valor (respeita prefers-reduced-motion)
function useCountUp(alvo) {
  const [v, setV] = useState(alvo), ant = useRef(alvo);
  useEffect(() => {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setV(alvo); ant.current = alvo; return; }
    const ini = ant.current, t0 = performance.now(); let raf;
    const f = t => { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3); setV(Math.round(ini + (alvo - ini) * e)); if (k < 1) raf = requestAnimationFrame(f); else ant.current = alvo; };
    raf = requestAnimationFrame(f);
    return () => cancelAnimationFrame(raf);
  }, [alvo]);
  return v;
}
function BigNum({ v }) {
  const neg = v < 0, a = Math.abs(v);
  return html`<span className="bignum num">${neg ? '−' : ''}<small>R$</small>${Math.floor(a / 100).toLocaleString('pt-BR')}<small>,${pad(a % 100)}</small></span>`;
}

function MentorPage() {
  const { aba, setAba } = useApp(), a = MENTOR ? aba.mentor : 'insights';
  return html`<div className="page">

function MentorChat() {
  const { A, upd, hojeS, demo, mentorPre, setMentorPre, ir } = useApp();
  const [txt, setTxt] = useState(mentorPre || '');
  const [busy, setBusy] = useState(false), [parcial, setParcial] = useState(''), [erro, setErro] = useState(''), [semIA, setSemIA] = useState(false);
  const fim = useRef(null), ctl = useRef(null), conversando = A.mentor.length > 0 || busy;
  useEffect(() => { if (mentorPre) setMentorPre(''); }, []);
  useEffect(() => { if (conversando && fim.current) fim.current.scrollIntoView({ block: 'end' }); }, [A.mentor.length, parcial, busy]);
  const enviar = async pergunta => {
    const q = (pergunta != null ? pergunta : txt).trim();
    if (!q || busy) return;
    setTxt(''); setErro(''); setParcial(''); setBusy(true);
    const hist = [...A.mentor, { r: 'u', t: q.slice(0, 1500) }];
    upd(s => ({ ...s, mentor: hist.slice(-30) }));
    try {
      const sample = await usar('sample');
      if (!sample) { setSemIA(true); return; }
      ctl.current = new AbortController();
      const { text } = await sample(montarPrompt(A, hojeS, hist.slice(-10), !!demo), { modelTier: 'default', cache: false, signal: ctl.current.signal, onText: ({ text }) => setParcial(text) });
      upd(s => ({ ...s, mentor: [...hist, { r: 'a', t: text.trim().slice(0, 3500) }].slice(-30) }));
    } catch (e) {
      if (e && e.text) upd(s => ({ ...s, mentor: [...hist, { r: 'a', t: e.text.slice(0, 3500) }].slice(-30) }));
      const c = e && e.code;
      setErro(c === 'not_granted' ? 'Você não autorizou o uso do Claude nesta página. Toque em enviar de novo para decidir outra vez.' : c === 'rate_limited' ? 'Muitas perguntas em pouco tempo. Aguarde um instante.' : c === 'aborted' ? 'Resposta interrompida.' : 'Não consegui falar com o Claude agora. Tente de novo em instantes.');
    } finally { setBusy(false); setParcial(''); }
  };
  const SUGS = [{ i: 'chart', t: 'Como está o meu orçamento este mês?', q: 'Como está o meu orçamento este mês? Explique em poucas linhas, com base nos meus dados.' }, { i: 'cart', t: 'Vale a pena fazer esta compra?', pre: 'Quero comprar ____ por R$ ____. Vale a pena?' }, { i: 'target', t: 'Como posso economizar mais neste mês?', q: 'Onde posso reduzir gastos com mais facilidade, olhando meus dados?' }, { i: 'spark', t: 'Me dê uma ação pequena para hoje', q: 'Qual é uma ação pequena de até 5 minutos que eu posso fazer hoje?' }, { i: 'shield', t: 'Me ajude a planejar minha reserva de emergência', q: 'Me ajude a planejar uma reserva de emergência. Faça perguntas curtas se precisar de algum dado.' }];
  return html`<${Frag}>
    ${conversando ? null : html`<div><h1 className="mtitle">Seu mentor financeiro<${Ico} n="spark" s=${30} /></h1><p className="mut" style=${{ marginTop: 10 }}>Converse sobre suas finanças, tire dúvidas, analise compras e receba orientações personalizadas. Não faço diagnósticos nem promessas de ganho.</p></div>`}
    ${demo ? html`<div className="note">Modo demonstração: o mentor responde com base nos dados de exemplo.</div>` : null}
    ${conversando ? html`<div className="chat" aria-live="polite">
      ${A.mentor.map((m, i) => html`<div key=${i} className=${'msg ' + m.r}>${m.r === 'a' ? html`<${Md} texto=${m.t} />` : m.t}</div>`)}
      ${busy ? html`<div className="msg a">${parcial ? html`<${Md} texto=${parcial} />` : html`<span className="dots3" aria-label="Pensando"><span></span><span></span><span></span></span>`}</div>` : null}
      ${erro ? html`<div className="err" role="alert">${erro}</div>` : null}
      ${semIA ? html`<div className="note">O mentor precisa do Claude, que só responde com esta página aberta dentro dele. Aqui fora, os insights e o “Antes de comprar” funcionam sem IA. <button className="link" onClick=${() => ir('radar')}>Ver insights</button></div>` : null}
      <div ref=${fim}></div></div>` : null}
    ${!busy ? (conversando ? html`<div className="chips">${SUGS.slice(0, 4).map(s => html`<button key=${s.t} className="chip" onClick=${() => s.q ? enviar(s.q) : setTxt(s.pre)}>${s.t}</button>`)}</div>`
      : html`<div className="stack">${SUGS.slice(0, 4).map(s => html`<button key=${s.t} className="sug" onClick=${() => s.q ? enviar(s.q) : setTxt(s.pre)}><span className="t"><${Ico} n=${s.i} s=${22} /></span><span className="x">${s.t}</span><${Ico} n="chevR" s=${16} /></button>`)}</div>`) : null}
    <form className="composer-glass" onSubmit=${e => { e.preventDefault(); enviar(); }}>
      <input id="mentor-in" aria-label="Sua mensagem" placeholder="Digite sua mensagem..." value=${txt} maxLength="1500" onChange=${e => setTxt(e.target.value)} />
      ${busy ? html`<button type="button" className="btn sm" onClick=${() => ctl.current && ctl.current.abort()}>Parar</button>` : html`<button type="submit" className="sendbtn" aria-label="Enviar"><${Ico} n="send" s=${20} /></button>`}</form>
    <div className="row sb xs mut"><span>Cada resposta usa o seu acesso ao Claude e envia junto um resumo dos seus dados.</span>${A.mentor.length ? html`<button className="link" onClick=${() => upd(s => ({ ...s, mentor: [] }))}>Limpar conversa</button>` : null}</div>
  <//>`;
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { erro: null }; }
  static getDerivedStateFromError(e) { return { erro: e }; }
  render() {
    if (!this.state.erro) return this.props.children;
    let bruto = ''; try { bruto = localStorage.getItem(CHAVE) || ''; } catch (e) { }
    return html`<div className="card stack" style=${{ margin: '40px auto', maxWidth: 560 }}><h2>Algo deu errado ao mostrar esta tela</h2><p className="mut">Seus dados continuam guardados. Recarregue a página; se o problema voltar, copie o backup abaixo e guarde num arquivo.</p>
      <p className="sm err">${String(this.state.erro && this.state.erro.message || this.state.erro)}</p>
      <button className="btn primary" onClick=${() => this.setState({ erro: null })}>Tentar de novo</button>${bruto ? html`<pre className="out">${bruto.slice(0, 40000)}</pre>` : null}</div>`;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${ErrorBoundary}><${Provider}><${Shell} /><//><//>`);

/* ===== PWA: service worker (só em http/https) ===== */
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  const tinha = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  // versão nova assumiu: recarrega uma vez para não ficar com tela velha
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (tinha && !window.__recarregou) { window.__recarregou = true; location.reload(); } });
}
