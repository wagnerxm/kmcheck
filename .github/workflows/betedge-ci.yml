name: betedge-ci

# Pipeline de CI do BetEdge — só dispara quando algo dentro de betedge/ muda,
# já que este repositório também hospeda o app KM Check (raiz do repo), que
# tem seu próprio fluxo de publicação (GitHub Pages) e não depende deste
# workflow.
on:
  push:
    branches: [main]
    paths:
      - "betedge/**"
      - ".github/workflows/betedge-ci.yml"
  pull_request:
    paths:
      - "betedge/**"
      - ".github/workflows/betedge-ci.yml"

# Cancela execuções antigas do mesmo PR/branch quando um novo push chega —
# evita gastar minutos de CI validando um estado já superado.
concurrency:
  group: betedge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  PNPM_VERSION: "9.15.0"

defaults:
  run:
    # Todo comando roda a partir de betedge/ por padrão — evita repetir
    # `working-directory: betedge` em cada step (jobs que precisam de outro
    # diretório, como test-engine, sobrescrevem isso passo a passo).
    working-directory: betedge

jobs:
  # -----------------------------------------------------------------------
  # lint-and-typecheck — ESLint/eslint-config-next e `tsc --noEmit` em todo
  # o monorepo TypeScript (apps/web, packages/*, services/workers/node),
  # orquestrado via Turborepo (com cache local do turbo por execução).
  # -----------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolver diretório do store do pnpm
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache do store do pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          # pnpm-lock.yaml ainda não existe em todo commit desta fase inicial
          # do projeto — hashFiles retorna vazio nesse caso e a cache key cai
          # de forma segura para a chave menos específica via restore-keys,
          # sem quebrar o step (só perde um pouco de hit rate até o lockfile
          # ser commitado).
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('betedge/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: turbo lint
        run: pnpm lint

      - name: turbo typecheck
        run: pnpm typecheck

  # -----------------------------------------------------------------------
  # test-frontend — testes unitários do app Next.js (apps/web).
  # -----------------------------------------------------------------------
  test-frontend:
    name: Testes — Frontend (apps/web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolver diretório do store do pnpm
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache do store do pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('betedge/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: pnpm test (apps/web)
        # --if-present: nesta fase inicial do monorepo, ainda pode haver
        # janelas em que o pacote está sem script `test` publicado — o job
        # não deve quebrar o pipeline por isso, só quando um teste de fato
        # existente falhar.
        run: pnpm --filter @betedge/web run test --if-present
        working-directory: betedge

  # -----------------------------------------------------------------------
  # test-engine — testes do Motor Estatístico (FastAPI/Python), incluindo a
  # suíte crítica de prevenção de vazamento de dados (walk-forward).
  # -----------------------------------------------------------------------
  test-engine:
    name: Testes — Engine (services/engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: betedge/services/engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: betedge/services/engine/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        run: pytest -v

  # -----------------------------------------------------------------------
  # test-workers — testes dos workers Node (BullMQ) responsáveis pela coleta
  # e normalização de odds.
  # -----------------------------------------------------------------------
  test-workers:
    name: Testes — Workers Node (services/workers/node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolver diretório do store do pnpm
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache do store do pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('betedge/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: pnpm test (services/workers/node)
        run: pnpm --filter @betedge/workers-node run test --if-present
        working-directory: betedge
