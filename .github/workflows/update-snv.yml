name: Update SNV Road Data

# Sem agendamento diário: a nuvem do DNIT (servicos.dnit.gov.br) não aceita conexão de fora do Brasil e os
# computadores do GitHub (e o VPS) ficam nos EUA — toda execução morria em "UND_ERR_CONNECT_TIMEOUT" (81 falhas
# seguidas até out/2026). A atualização é feita de um computador no Brasil:
#   WEBDAV_SHARE_TOKEN=... node scripts/fetch-snv-wfs.mjs        (rodovias + pista dupla, quando sai SNV novo)
#   WEBDAV_SHARE_TOKEN=... SO_DUPLICADAS=1 node scripts/fetch-snv-wfs.mjs   (só a pista dupla)
# Aqui fica só o disparo manual, para o dia em que o DNIT liberar o acesso de fora.
on:
  workflow_dispatch:
    inputs:
      so_duplicadas:
        description: 'Refazer só os trechos de pista dupla (data/rodovias/duplicadas.json), mesmo sem SNV novo'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (undici)
        run: npm install
        working-directory: scripts

      - name: Fetch SNV shapefile from DNIT Cloud
        run: node scripts/fetch-snv-wfs.mjs
        timeout-minutes: 45
        env:
          WEBDAV_SHARE_TOKEN: ${{ secrets.WEBDAV_SHARE_TOKEN }}
          SO_DUPLICADAS: ${{ inputs.so_duplicadas && '1' || '' }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Update SNV road data $(cat data/rodovias/index.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).snv)")" && git push)
