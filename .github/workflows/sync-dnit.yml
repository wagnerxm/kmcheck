name: Sincronizar DNIT -> Supabase

# Agendamento mensal desligado em 2026-10-19: grava em pontos_rodovia (Supabase), que o app não usa mais
# (as rodovias vêm de data/rodovias e da API própria). O mesmo projeto Supabase é do NO.BLIND — não mexer nele.
on:
  workflow_dispatch: {}    # permite rodar manualmente pela aba "Actions" do GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        working-directory: scripts
        run: npm install

      - name: Instalar navegador (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Rodar sincronização
        working-directory: scripts
        run: node sync-dnit.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
