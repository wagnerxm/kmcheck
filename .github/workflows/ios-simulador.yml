# Abre o app de iPhone num simulador (Mac do GitHub), com GPS simulado numa BR, e guarda prints e o registro
# do console. Serve para conferir que o app abre, desenha a tela e recebe o GPS nativo — sem precisar de iPhone.
name: iOS → simulador

on:
  workflow_dispatch:

jobs:
  simulador:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: App web → projeto iOS
        working-directory: mobile
        run: |
          npm ci
          node copiar-app.mjs
          npx cap sync ios

      - name: Compilar para o simulador
        run: |
          set -o pipefail
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Abrir no simulador
        run: |
          set -x
          # o iPhone mais novo disponível
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];l=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print(l[-1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "App.app" -maxdepth 2 | head -1)
          xcrun simctl install "$UDID" "$APP"
          # GPS numa BR (BR-226/RN) e permissões já dadas, como depois do "Permitir"
          xcrun simctl location "$UDID" set -6.0775,-37.5374
          xcrun simctl privacy "$UDID" grant location br.com.kmcheck.app
          xcrun simctl privacy "$UDID" grant photos-add br.com.kmcheck.app
          mkdir -p sim
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "App"' > sim/console.log 2>&1 &
          LOGPID=$!
          xcrun simctl launch "$UDID" br.com.kmcheck.app
          sleep 20; xcrun simctl io "$UDID" screenshot sim/1-abertura.png
          sleep 25; xcrun simctl io "$UDID" screenshot sim/2-depois.png
          kill $LOGPID || true
          echo "--- console do app (JS e nativo) ---"
          grep -E "⚡️|\[error\]|\[warn\]|Error|error" sim/console.log | tail -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulador
          path: sim/
          retention-days: 14
