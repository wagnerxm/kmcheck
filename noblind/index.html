<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="NO.BLIND — Análise esportiva com modelos estatísticos">
<title>NO.BLIND</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== reset & design tokens ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --lime:#A3E635;--lime-d:rgba(163,230,53,.10);--lime-dk:#65A30D;
  --dark:#09090B;--dark2:#18181B;--dark3:#27272A;
  --bg:#EEEEF0;--bg2:#E8E8EB;
  /* card escuro sólido com brilho de superfície (estilo PATO) */
  --glass:#1A1C22;--glass-border:rgba(255,255,255,.06);
  --glass-solid:#222428;
  --border:rgba(0,0,0,.05);--border-s:rgba(0,0,0,.08);
  --success:#22C55E;--success-d:rgba(34,197,94,.10);
  --danger:#EF4444;--danger-d:rgba(239,68,68,.10);
  --warning:#F59E0B;
  --txt:#09090B;--muted:#71717A;--subtle:#A1A1AA;
  --font:'Outfit',system-ui,-apple-system,sans-serif;
  --r:2rem;--r-sm:1.25rem;--r-lg:2.5rem;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--txt);line-height:1.5;
  overflow:hidden;height:100dvh;position:fixed;width:100%;top:0;left:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-user-select:none}
img{max-width:100%}
::-webkit-scrollbar{width:0;height:0}

/* ===== fundo hexagonal 3D branco ===== */
#bg-art{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bg-art svg{width:100%;height:100%}

/* ===== layout shell ===== */
#app{display:flex;height:100dvh;width:100%;position:relative;z-index:1}
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#topbar{display:flex;align-items:center;justify-content:space-between;height:56px;
  padding:0 20px;flex-shrink:0;
  background:rgba(238,238,240,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(100px + var(--safe-b))}

/* ===== topbar ===== */
.tb-brand{display:flex;align-items:center;gap:8px}
.tb-logo{font-size:1.125rem;font-weight:900;letter-spacing:-.03em}
.tb-dot{color:var(--lime-dk)}
.tb-actions{display:flex;align-items:center;gap:8px}

/* ===== floating bottom nav — pílula preta ===== */
#bottom-nav{position:fixed;left:16px;right:16px;
  bottom:calc(10px + var(--safe-b));z-index:50}
.bn-bar{display:flex;align-items:center;gap:0;
  background:var(--dark);border-radius:var(--r);padding:4px;
  border:1px solid rgba(255,255,255,.06);border-top-color:rgba(255,255,255,.08)}
.bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  flex:1;height:52px;border-radius:calc(var(--r) - 4px);
  font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.35);transition:all .25s ease;
  -webkit-tap-highlight-color:transparent;cursor:pointer}
.bn-item.active{color:var(--dark);background:var(--lime)}
.bn-item svg{flex-shrink:0}
.bn-item .ic{line-height:0}

/* ===== card escuro sólido 3D ===== */
.card{background:var(--glass);border-radius:var(--r);padding:20px;color:#fff;position:relative;
  border:1px solid var(--glass-border);border-top-color:rgba(255,255,255,.10);
  box-shadow:0 2px 4px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.18),0 20px 48px rgba(0,0,0,.12);
  transform:perspective(800px) translateZ(0);transform-style:preserve-3d}

/* ===== BILHETE DO DIA — bloco preto sólido de alto contraste ===== */
.ticket-hero{background:var(--dark);border-radius:var(--r-lg);padding:0;color:#fff;
  position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);border-top-color:rgba(255,255,255,.14);
  box-shadow:0 2px 4px rgba(0,0,0,.10),0 8px 20px rgba(0,0,0,.15),0 20px 48px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.06);
  transform:perspective(800px) translateZ(0);transform-style:preserve-3d}
.ticket-header{padding:24px 24px 0;display:flex;align-items:center;justify-content:space-between}
.ticket-label{font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:rgba(255,255,255,.35)}
.ticket-type{font-size:.625rem;font-weight:700;padding:5px 12px;border-radius:999px;
  background:rgba(163,230,53,.15);color:var(--lime);text-transform:uppercase;letter-spacing:.06em}
.ticket-odds-total{text-align:center;padding:28px 24px 20px}
.ticket-odds-number{font-size:4rem;font-weight:900;line-height:1;letter-spacing:-.04em;color:var(--lime)}
.ticket-odds-label{font-size:.6875rem;color:rgba(255,255,255,.35);margin-top:8px;text-transform:uppercase;
  letter-spacing:.08em;font-weight:600}
.ticket-legs{border-top:1px solid rgba(255,255,255,.06);padding:16px 24px;
  display:flex;flex-direction:column;gap:14px}
.ticket-leg{display:flex;align-items:center;gap:10px}
.ticket-leg-teams{flex:1;min-width:0}
.ticket-leg-match{font-size:.8125rem;font-weight:700;line-height:1.3}
.ticket-leg-meta{font-size:.6875rem;color:rgba(255,255,255,.35);font-weight:500}
.ticket-leg-pick{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ticket-leg-sel{font-size:.625rem;font-weight:700;color:var(--lime);text-transform:uppercase;letter-spacing:.04em}
.ticket-leg-odd{font-size:1.25rem;font-weight:900}
.ticket-footer{border-top:1px solid rgba(255,255,255,.06);padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between}
.ticket-conf{display:flex;align-items:center;gap:6px;font-size:.6875rem;color:rgba(255,255,255,.35);font-weight:500}

/* ===== escudo do time — formato de shield SVG ===== */
.team-shield{flex-shrink:0;line-height:0}
.team-shield.away{margin-left:-8px;position:relative;z-index:1}

/* ===== bet card — sólido 3D ===== */
.bet-card{background:var(--glass);border-radius:var(--r);padding:18px;cursor:pointer;
  color:#fff;position:relative;
  border:1px solid var(--glass-border);border-top-color:rgba(255,255,255,.10);
  box-shadow:0 2px 4px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.18),0 20px 48px rgba(0,0,0,.12);
  transform:perspective(800px) translateZ(0);transform-style:preserve-3d;
  transition:transform .2s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent}
.bet-card:active{transform:perspective(800px) translateZ(-3px) scale(.97);
  box-shadow:0 1px 3px rgba(0,0,0,.15),0 4px 8px rgba(0,0,0,.10)}
.bet-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.bet-teams-col{display:flex;align-items:center}
.bet-info{flex:1;min-width:0}
.bet-match{font-size:.875rem;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.bet-meta{font-size:.6875rem;color:rgba(255,255,255,.45);margin-top:2px;font-weight:500}
.bet-right{display:flex;flex-direction:column;align-items:flex-end}
.bet-odd{font-size:2.25rem;font-weight:900;line-height:1;letter-spacing:-.03em;color:#fff}
.bet-book{font-size:.5625rem;color:rgba(255,255,255,.4);margin-top:2px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em}
.bet-bottom{display:flex;align-items:center;justify-content:space-between;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.06)}
.bet-sel{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:999px;
  background:var(--lime);color:var(--dark);font-weight:700;font-size:.6875rem}
.bet-edge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:600;color:rgba(255,255,255,.45)}
.bet-edge-val{color:var(--lime);font-weight:800}

/* ===== múltipla card — sólido 3D ===== */
.multi-card{background:var(--glass);border-radius:var(--r);overflow:hidden;
  color:#fff;position:relative;
  border:1px solid var(--glass-border);border-top-color:rgba(255,255,255,.10);
  box-shadow:0 2px 4px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.18),0 20px 48px rgba(0,0,0,.12);
  transform:perspective(800px) translateZ(0);transform-style:preserve-3d;
  cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent}
.multi-card:active{transform:perspective(800px) translateZ(-3px) scale(.97);
  box-shadow:0 1px 3px rgba(0,0,0,.15),0 4px 8px rgba(0,0,0,.10)}
.multi-header{display:flex;align-items:center;justify-content:space-between;padding:18px;
  border-bottom:1px solid rgba(255,255,255,.06)}
.multi-type{font-size:.625rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  padding:5px 12px;border-radius:999px}
.multi-type--dupla{background:var(--success-d);color:var(--success)}
.multi-type--tripla{background:rgba(245,158,11,.10);color:var(--warning)}
.multi-type--quadra{background:var(--lime-d);color:var(--lime-dk)}
.multi-odd{font-size:2rem;font-weight:900;letter-spacing:-.03em}
.multi-legs{padding:0}
.multi-leg{display:flex;align-items:center;gap:10px;padding:14px 18px;
  border-bottom:1px solid rgba(255,255,255,.06)}
.multi-leg:last-child{border-bottom:none}
.multi-leg-info{flex:1;min-width:0}
.multi-leg-match{font-size:.8125rem;font-weight:700}
.multi-leg-pick{font-size:.6875rem;color:var(--lime);font-weight:700}
.multi-leg-odd{font-size:1.125rem;font-weight:900}

/* ===== section label ===== */
.section-label{font-size:.6875rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.12em;color:var(--subtle)}
#detail-sheet .section-label{color:rgba(255,255,255,.4)}

/* ===== pill bar — pílulas pretas ===== */
.pill-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.pill-bar::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;padding:9px 18px;border-radius:999px;
  font-size:.8125rem;font-weight:700;background:var(--glass-solid);color:rgba(255,255,255,.6);
  border:1px solid var(--glass-border);border-top-color:rgba(255,255,255,.08);cursor:pointer;white-space:nowrap;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
  box-shadow:0 2px 6px rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.10)}
.pill:active{transform:scale(.96)}
.pill.active{background:var(--dark);color:var(--lime);border-color:var(--dark);
  backdrop-filter:none;-webkit-backdrop-filter:none}

/* ===== botão pílula preta / lime ===== */
.btn-pill{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;
  border-radius:999px;font-size:.8125rem;font-weight:700;transition:transform .15s;
  -webkit-tap-highlight-color:transparent}
.btn-pill:active{transform:scale(.96)}
.btn-pill--dark{background:var(--dark);color:#fff}
.btn-pill--lime{background:var(--lime);color:var(--dark)}
.btn-pill .arrow{font-size:1rem;font-weight:400}

/* ===== stat pills ===== */
.stat-pill{display:inline-flex;align-items:center;gap:4px;
  padding:5px 12px;border-radius:999px;font-size:.6875rem;font-weight:700}
.stat-pill--live{background:var(--success-d);color:var(--success)}
.stat-pill--demo{background:var(--lime-d);color:var(--lime-dk)}
.stat-pill__dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.stat-pill--live .stat-pill__dot{background:var(--success);animation:pulse 2s ease-in-out infinite}

/* ===== bento grid — layout assimétrico ===== */
.bento{display:grid;gap:12px}
.bento--hero{grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr}
.bento--hero .bento-tall{grid-row:span 2}
.bento--trio{grid-template-columns:repeat(3,1fr)}
.bento--duo{grid-template-columns:1fr 1fr}
.bento-card{background:var(--glass);border-radius:var(--r);padding:20px;
  border:1px solid var(--glass-border);border-top-color:rgba(255,255,255,.10);
  display:flex;flex-direction:column;justify-content:center;color:#fff;position:relative;
  box-shadow:0 2px 4px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.18),0 20px 48px rgba(0,0,0,.12);
  transform:perspective(800px) translateZ(0);transform-style:preserve-3d}
.bento-card--lime{background:var(--lime);border-color:var(--lime);color:var(--dark);
  backdrop-filter:none;-webkit-backdrop-filter:none}
.bento-card--dark{background:var(--dark);border-color:var(--dark);color:#fff;
  backdrop-filter:none;-webkit-backdrop-filter:none}
.bento-val{font-size:2rem;font-weight:900;line-height:1;letter-spacing:-.03em}
.bento-val--xl{font-size:2.75rem}
.bento-label{font-size:.5625rem;color:rgba(255,255,255,.4);margin-top:6px;text-transform:uppercase;
  letter-spacing:.08em;font-weight:700}
.bento-card--lime .bento-label{color:rgba(9,9,11,.5)}
.bento-card--dark .bento-label{color:rgba(255,255,255,.4)}

/* ===== KPI strip horizontal — glass chips ===== */
.kpi-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.kpi-strip::-webkit-scrollbar{display:none}
.kpi-chip{flex-shrink:0;background:var(--glass);color:#fff;
  border-radius:var(--r-sm);padding:12px 16px;text-align:center;position:relative;
  border:1px solid var(--glass-border);border-top-color:rgba(255,255,255,.10);
  box-shadow:0 2px 4px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.18),0 16px 36px rgba(0,0,0,.10);
  transform:perspective(800px) translateZ(0);transform-style:preserve-3d}
.kpi-chip-val{font-weight:900;font-size:1rem;line-height:1.2;letter-spacing:-.02em}
.kpi-chip-label{font-size:.5rem;color:rgba(255,255,255,.4);margin-top:3px;text-transform:uppercase;
  letter-spacing:.08em;font-weight:700}

/* ===== detail sheet ===== */
#detail-sheet{position:fixed;inset:0;z-index:100;display:none;flex-direction:column}
#detail-sheet.open{display:flex}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sheet-body{position:absolute;bottom:0;left:0;right:0;max-height:92dvh;
  background:rgba(18,20,26,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;
  border-radius:var(--r-lg) var(--r-lg) 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-top:1px solid rgba(255,255,255,.12);
  box-shadow:0 -4px 16px rgba(0,0,0,.15),0 -12px 48px rgba(0,0,0,.25);
  animation:sheetUp .3s cubic-bezier(.22,1,.36,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin:12px auto}
.sheet-close{position:absolute;top:14px;right:14px;width:36px;height:36px;display:flex;
  align-items:center;justify-content:center;border-radius:var(--r-sm);color:rgba(255,255,255,.6);
  background:var(--glass-solid);z-index:2;border:1px solid var(--glass-border)}

/* ===== odds table ===== */
.odds-table{width:100%;border-collapse:separate;border-spacing:0 4px}
.odds-table th{font-size:.5625rem;font-weight:800;color:rgba(255,255,255,.4);text-transform:uppercase;
  letter-spacing:.08em;padding:6px 8px;text-align:center}
.odds-table th:first-child{text-align:left}
.odds-table td{padding:10px;text-align:center;font-size:.8125rem;font-weight:600;
  background:rgba(255,255,255,.06);border:none}
.odds-table td:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);text-align:left;font-weight:700}
.odds-table td:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.odds-best{color:var(--lime);font-weight:800;background:rgba(163,230,53,.15)!important}

/* ===== model bars ===== */
.model-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.model-bar-name{font-size:.75rem;color:rgba(255,255,255,.5);width:90px;flex-shrink:0;text-align:right;font-weight:600}
.model-bar-track{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.model-bar-fill{height:100%;border-radius:999px;transition:width .6s ease-out}
.model-bar-val{font-size:.75rem;font-weight:800;width:42px;flex-shrink:0}

/* ===== ROI cards — glass ===== */
.roi-card{background:var(--glass);border-radius:var(--r);padding:16px 18px;
  display:flex;align-items:center;color:#fff;position:relative;
  justify-content:space-between;border:1px solid var(--glass-border);border-top-color:rgba(255,255,255,.10);
  box-shadow:0 2px 4px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.18),0 20px 48px rgba(0,0,0,.12);
  transform:perspective(800px) translateZ(0);transform-style:preserve-3d}
.roi-card-info{flex:1}
.roi-card-name{font-weight:800;font-size:.875rem;letter-spacing:-.01em}
.roi-card-sub{font-size:.6875rem;color:rgba(255,255,255,.45);font-weight:500;margin-top:1px}
.roi-card-val{font-weight:900;font-size:1.125rem;letter-spacing:-.02em;color:var(--lime)}

/* ===== animações ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease-out both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== page ===== */
.page{display:none;padding:20px}
.page.active{display:block}

/* ===== utilities ===== */
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.text-center{text-align:center}
/* ===== reflexo sutil de superfície — brilho diagonal estilo PATO ===== */
.card::before,.bet-card::before,.bento-card::before,.kpi-chip::before,.roi-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 40%,transparent 60%)}
/* multi-card tem overflow:hidden, então o ::before fica contido */
.multi-card::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 40%,transparent 60%)}
/* ticket hero — reflexo sutil no canto */
.ticket-hero::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(255,255,255,.03) 0%,transparent 100%);border-radius:var(--r-lg) var(--r-lg) 0 0}
/* cards lime/dark — reflexo adaptado ao fundo opaco */
.bento-card--lime::before{background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,rgba(255,255,255,.04) 40%,transparent 60%)}
.bento-card--dark::before{background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.015) 40%,transparent 60%)}
/* 3D — lime e dark com sombra 3D também */
.bento-card--lime{box-shadow:0 2px 4px rgba(0,0,0,.06),0 6px 16px rgba(163,230,53,.12),0 16px 40px rgba(0,0,0,.10);
  border-top-color:rgba(255,255,255,.25)}
.bento-card--dark{box-shadow:0 2px 4px rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.18),0 20px 48px rgba(0,0,0,.22);
  border-top-color:rgba(255,255,255,.08)}
/* bottom nav — 3D flutuante */
.bn-bar{box-shadow:0 2px 6px rgba(0,0,0,.15),0 8px 24px rgba(0,0,0,.20),0 20px 48px rgba(0,0,0,.25)}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- fundo hexagonal 3D — denso no canto inferior-direito -->
<div id="bg-art" aria-hidden="true">
<svg viewBox="0 0 420 920" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hex-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".10"/>
    </filter>
  </defs>
  <g fill="#fff" filter="url(#hex-shadow)">

let currentPage='home';
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}

/* escudo do time — SVG em formato de shield com a cor e abreviação */
function tc(name,sz=30,extra=''){
  const src=LOGOS[name];
  const aw=extra.includes('away');
  const cls=aw?'team-shield away':'team-shield';
  if(src){
    return `<div class="${cls}" style="width:${sz}px;height:${sz}px">
      <img src="${src}" width="${sz}" height="${sz}" alt="${name}" style="object-fit:contain;${aw?'filter:drop-shadow(0 0 2px rgba(255,255,255,.8))':''}">
    </div>`;
  }
  /* fallback: círculo colorido com abreviação */
  const t=TEAMS[name]||{a:name.slice(0,3).toUpperCase(),c:'#555'};
  return `<div class="${cls}" style="width:${sz}px;height:${sz}px;background:${t.c};border-radius:50%;display:flex;align-items:center;justify-content:center">
    <span style="color:#fff;font-size:${Math.round(sz*.35)}px;font-weight:800;font-family:Outfit,sans-serif">${t.a}</span>
  </div>`;
}
function multiOdd(legs){return legs.reduce((a,l)=>a*l.odd,1)}

function navigate(p){currentPage=p;renderPage();updateNav();$('#content').scrollTop=0}

  const nav=$('#bottom-nav');
  let h='<div class="bn-bar">';

    const on=p.id===currentPage;
    h+=`<button class="bn-item${on?' active':''}" data-page="${p.id}" onclick="navigate('${p.id}')">
      <span class="ic">${icon(p.icon,20)}</span><span>${p.label}</span></button>`;
  });
  nav.innerHTML=h+'</div>';
}
function renderPage(){
  const c=$('#content');
  switch(currentPage){
    case 'home':c.innerHTML=renderHome();break;
    case 'singles':c.innerHTML=renderSingles();break;
    case 'multiples':c.innerHTML=renderMultiples();break;
    case 'stats':c.innerHTML=renderStats();break;
    default:c.innerHTML=renderHome();
  }
  renderBottomNav();
}

/* ========================================================
   TELA 1 — HOJE
   ======================================================== */

    </div>

      <div class="kpi-chip"><div class="kpi-chip-val" style="color:var(--lime)">+${KPIS.roi}%</div><div class="kpi-chip-label">ROI</div></div>
      <div class="kpi-chip"><div class="kpi-chip-val">${KPIS.hitRate}%</div><div class="kpi-chip-label">Hit Rate</div></div>
      <div class="kpi-chip"><div class="kpi-chip-val" style="color:var(--lime)">+${KPIS.edge}%</div><div class="kpi-chip-label">Edge Médio</div></div>
      <div class="kpi-chip"><div class="kpi-chip-val" style="color:var(--warning)">${KPIS.brier}</div><div class="kpi-chip-label">Brier</div></div>
      <div class="kpi-chip"><div class="kpi-chip-val">${SINGLES.length}</div><div class="kpi-chip-label">Jogos</div></div>
    </div>

    <!-- BILHETE DO DIA -->
    <div>
      <div class="flex items-center justify-between" style="margin-bottom:12px">
        <span class="section-label">${icon('zap',14)} BILHETE DO DIA</span>
        <span style="font-size:.625rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--dark);color:var(--lime);text-transform:uppercase;letter-spacing:.06em">Tripla</span>
      </div>
      <div class="ticket-hero">
        <div class="ticket-header">
          <span class="ticket-label">Odd Combinada</span>
          <span class="ticket-type">Score ${Math.round(ticketLegs.reduce((s,l)=>s+l.score,0)/ticketLegs.length)}</span>
        </div>
        <div class="ticket-odds-total">
          <div class="ticket-odds-number">${ticketOdd.toFixed(2)}</div>
          <div class="ticket-odds-label">${ticketLegs.length} seleções combinadas</div>
        </div>
        <div class="ticket-legs">
          ${ticketLegs.map(l=>`<div class="ticket-leg">

              ${tc(l.home,22)}${tc(l.away,22,'away')}
              <div style="min-width:0">
                <div class="ticket-leg-match">${l.home} vs ${l.away}</div>
                <div class="ticket-leg-meta">${l.league} · ${l.time}</div>
              </div>
            </div>
            <div class="ticket-leg-pick">
              <div class="ticket-leg-sel">${l.sel}</div>
              <div class="ticket-leg-odd">${l.odd.toFixed(2)}</div>
            </div>
          </div>`).join('')}
        </div>
        <div class="ticket-footer">
          <div class="ticket-conf">${icon('shield',14)} Edge acumulado</div>
          <button class="btn-pill btn-pill--lime" style="padding:8px 16px;font-size:.75rem" onclick="openMultiSheet('ticket')">
            Detalhes <span class="arrow">↗</span>
          </button>
        </div>
      </div>
    </div>

    <!-- MELHORES SINGLES -->
    <div class="flex items-center justify-between">
      <span class="section-label">MELHORES SINGLES</span>
      <button class="btn-pill btn-pill--dark" style="padding:6px 14px;font-size:.6875rem" onclick="navigate('singles')">
        Ver todos <span class="arrow">↗</span>
      </button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${best.slice(0,4).map(s=>renderBetCard(s)).join('')}
    </div>

    <!-- MÚLTIPLAS -->
    <div class="flex items-center justify-between">
      <span class="section-label">MÚLTIPLAS SUGERIDAS</span>
      <button class="btn-pill btn-pill--dark" style="padding:6px 14px;font-size:.6875rem" onclick="navigate('multiples')">
        Ver todas <span class="arrow">↗</span>
      </button>
    </div>

/* ===== bet card — glass com odd protagonista ===== */
function renderBetCard(s){
  return `<div class="bet-card" onclick="openSheet(${s.id})">
    <div class="bet-top">
      <div class="bet-teams-col">${tc(s.home,28)}${tc(s.away,28,'away')}</div>
      <div class="bet-info">
        <div class="bet-match">${s.home} vs ${s.away}</div>
        <div class="bet-meta">${s.league} · ${s.time} · ${s.market}</div>
      </div>
      <div class="bet-right">
        <div class="bet-odd">${s.odd.toFixed(2)}</div>
        <div class="bet-book">${s.book}</div>
      </div>
    </div>
    <div class="bet-bottom">
      <div class="bet-sel">${icon('check',12)} ${s.sel}</div>
      <div class="bet-edge">Edge <span class="bet-edge-val">+${s.edge.toFixed(1)}%</span></div>
    </div>
  </div>`;
}

/* ===== multi card ===== */
function renderMultiCard(m){
  const total=multiOdd(m.legs);
  const typeClass=m.type==='Dupla'?'dupla':m.type==='Tripla'?'tripla':'quadra';
  return `<div class="multi-card" onclick="openMultiSheet('${m.id}')">
    <div class="multi-header">
      <span class="multi-type multi-type--${typeClass}">${m.type}</span>
      <div style="text-align:right">
        <div class="multi-odd">${total.toFixed(2)}</div>
        <div style="font-size:.6875rem;color:rgba(255,255,255,.4);font-weight:500">${m.legs.length} seleções</div>
      </div>
    </div>
    <div class="multi-legs">
      ${m.legs.map(l=>`<div class="multi-leg">
        <div style="display:flex;align-items:center;gap:6px">
          ${tc(l.home,20)}${tc(l.away,20,'away')}
        </div>
        <div class="multi-leg-info">
          <div class="multi-leg-match">${l.home} vs ${l.away}</div>
          <div class="multi-leg-pick">${l.sel}</div>
        </div>
        <div class="multi-leg-odd">${l.odd.toFixed(2)}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ========================================================
   TELA 2 — SINGLES
   ======================================================== */
function renderSingles(){
  const sorted=[...SINGLES].sort((a,b)=>b.score-a.score);
  return `<div class="page active fade-in">
    <div style="margin-bottom:20px">
      <h2 style="font-size:1.625rem;font-weight:900;letter-spacing:-.03em">Singles</h2>
      <p style="color:var(--muted);font-size:.8125rem;margin-top:2px;font-weight:500">${SINGLES.length} análises · ordenadas por score</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${sorted.map(s=>renderBetCard(s)).join('')}
    </div>
  </div>`;
}

/* ========================================================
   TELA 3 — MÚLTIPLAS
   ======================================================== */
function renderMultiples(){
  return `<div class="page active fade-in">
    <div style="margin-bottom:20px">
      <h2 style="font-size:1.625rem;font-weight:900;letter-spacing:-.03em">Múltiplas</h2>
      <p style="color:var(--muted);font-size:.8125rem;margin-top:2px;font-weight:500">Combinações sugeridas pela análise</p>
    </div>
    <div class="pill-bar" style="margin-bottom:16px">
      <button class="pill active" onclick="filterMulti(this,'')">Todas</button>
      <button class="pill" onclick="filterMulti(this,'Dupla')">Duplas</button>
      <button class="pill" onclick="filterMulti(this,'Tripla')">Triplas</button>
      <button class="pill" onclick="filterMulti(this,'Quadra')">Quadras</button>
    </div>
    <div id="multi-list" style="display:flex;flex-direction:column;gap:12px">
      ${MULTIPLES.map(m=>renderMultiCard(m)).join('')}
    </div>
  </div>`;
}
let multiFilter='';
function filterMulti(btn,type){
  multiFilter=type;
  $$('.pill-bar .pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const list=$('#multi-list');if(!list)return;
  const filtered=type?MULTIPLES.filter(m=>m.type===type):MULTIPLES;
  list.innerHTML=filtered.map(m=>renderMultiCard(m)).join('')||
    '<div style="text-align:center;padding:40px;color:var(--subtle);font-weight:500">Nenhuma múltipla deste tipo.</div>';
}

/* ========================================================
   TELA 4 — STATS — bento grid assimétrico
   ======================================================== */
function renderStats(){
  return `<div class="page active fade-in">
    <div style="margin-bottom:20px">
      <h2 style="font-size:1.625rem;font-weight:900;letter-spacing:-.03em">Estatísticas</h2>
      <p style="color:var(--muted);font-size:.8125rem;margin-top:2px;font-weight:500">Performance geral dos modelos</p>
    </div>

    <div class="bento bento--hero" style="margin-bottom:12px">
      <div class="bento-card bento-card--lime bento-tall" style="padding:28px 24px">
        <div class="bento-val bento-val--xl">+${KPIS.roi}%</div>
        <div class="bento-label">ROI Total</div>
      </div>
      <div class="bento-card" style="padding:20px">
        <div class="bento-val">${KPIS.hitRate}%</div>
        <div class="bento-label">Hit Rate</div>
      </div>
      <div class="bento-card bento-card--dark" style="padding:20px">
        <div class="bento-val" style="color:var(--lime)">+${KPIS.edge}%</div>
        <div class="bento-label">Edge Médio</div>
      </div>
    </div>
    <div class="bento bento--duo" style="margin-bottom:24px">
      <div class="bento-card" style="padding:20px">
        <div class="bento-val" style="color:var(--warning)">${KPIS.brier}</div>
        <div class="bento-label">Brier Score</div>
      </div>
      <div class="bento-card bento-card--dark" style="padding:20px">
        <div class="bento-val">${SINGLES.length}</div>
        <div class="bento-label">Jogos Analisados</div>
      </div>
    </div>

    <div class="section-label" style="margin-bottom:12px">POR MERCADO</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px">
      ${[{m:'Resultado Final',n:152,roi:13.1},{m:'Gols (Over/Under)',n:88,roi:15.8},{m:'Ambas Marcam',n:50,roi:7.4}].map(x=>`
        <div class="roi-card">
          <div class="roi-card-info"><div class="roi-card-name">${x.m}</div><div class="roi-card-sub">${x.n} análises</div></div>
          <div class="roi-card-val">+${x.roi}%</div>
        </div>`).join('')}
    </div>

    <div class="section-label" style="margin-bottom:12px">POR LIGA</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${[{l:'Brasileirão A',n:186,roi:14.2},{l:'Copa do Brasil',n:42,roi:8.7},{l:'Libertadores',n:38,roi:11.3}].map(x=>`
        <div class="roi-card">
          <div class="roi-card-info"><div class="roi-card-name">${x.l}</div><div class="roi-card-sub">${x.n} análises</div></div>
          <div class="roi-card-val">+${x.roi}%</div>
        </div>`).join('')}

    <p style="margin-top:20px;text-align:center;font-size:.5625rem;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);font-weight:600">⚠️ Resultados passados não indicam resultados futuros</p>
  </div>`;
}

/* ========================================================
   SHEET — detalhe do single
   ======================================================== */
function openSheet(id){
  const s=SINGLES.find(x=>x.id===id);if(!s)return;
  const models=Object.entries(s.models);
  const maxP=Math.max(...models.map(m=>m[1]));
  const bookNames=Object.keys(s.odds);
  const bestVal=Math.max(...Object.values(s.odds));

  $('#sheet-content').innerHTML=`
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="closeSheet()">${icon('x',16)}</button>
    <div style="padding:20px 20px 40px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px">
        ${tc(s.home,36)}${tc(s.away,36,'away')}
        <div style="flex:1">
          <div style="font-weight:900;font-size:1.0625rem;letter-spacing:-.02em">${s.home} vs ${s.away}</div>
          <div style="font-size:.75rem;color:rgba(255,255,255,.4);font-weight:500">${s.league} · Hoje ${s.time}</div>
        </div>
      </div>

      <!-- ODD GIGANTE -->
      <div class="card" style="text-align:center;padding:28px;margin-bottom:16px;border:2px solid var(--lime);background:rgba(255,255,255,.04)">
        <div style="font-size:.625rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-bottom:10px">${s.market}</div>
        <div style="font-size:3.5rem;font-weight:900;line-height:1;letter-spacing:-.04em;color:#fff">${s.odd.toFixed(2)}</div>
        <div style="margin-top:14px">
          <span class="btn-pill btn-pill--dark" style="padding:8px 20px;font-size:.8125rem;cursor:default">
            ${icon('check',14)} ${s.sel}
          </span>
        </div>
        <div style="font-size:.6875rem;color:rgba(255,255,255,.4);margin-top:10px;font-weight:500">${s.book} · Melhor odd disponível</div>
      </div>

      <div class="bento bento--trio" style="margin-bottom:20px">
        <div class="bento-card text-center" style="padding:14px">
          <div style="font-size:1.25rem;font-weight:900;color:var(--lime)">+${s.edge.toFixed(1)}%</div>
          <div class="bento-label">Edge</div>
        </div>
        <div class="bento-card text-center" style="padding:14px">
          <div style="font-size:1.25rem;font-weight:900">${(s.fairP*100).toFixed(1)}%</div>
          <div class="bento-label">Prob. Justa</div>
        </div>
        <div class="bento-card bento-card--dark text-center" style="padding:14px">
          <div style="font-size:1.25rem;font-weight:900;color:var(--lime)">${s.score}</div>
          <div class="bento-label">Score</div>
        </div>
      </div>

      <div class="section-label" style="margin-bottom:12px">PROBABILIDADE POR MODELO</div>
      <div style="margin-bottom:20px">
        ${models.map(([name,prob])=>{
          const pct=(prob*100).toFixed(1);const w=(prob/maxP)*100;
          const isE=name==='Ensemble';
          return `<div class="model-bar">
            <div class="model-bar-name" style="font-weight:${isE?'800':'600'}">${name}</div>
            <div class="model-bar-track"><div class="model-bar-fill" style="width:${w}%;background:${isE?'var(--lime)':'var(--subtle)'}"></div></div>
            <div class="model-bar-val" style="color:${isE?'var(--lime)':'#fff'}">${pct}%</div>
          </div>`;
        }).join('')}
      </div>

      <div class="section-label" style="margin-bottom:12px">ODDS POR CASA</div>
      <div style="overflow-x:auto">
        <table class="odds-table">
          <thead><tr><th>Casa</th><th>Odd</th></tr></thead>
          <tbody>${bookNames.map(b=>{
            const v=s.odds[b];const best=v===bestVal;
            return `<tr><td>${b}</td><td class="${best?'odds-best':''}">${v.toFixed(2)}${best?' ★':''}</td></tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;
  $('#detail-sheet').classList.add('open');
  document.body.style.overflow='hidden';
}

/* sheet da múltipla */
function openMultiSheet(id){
  let m;
  if(id==='ticket'){
    const best=[...SINGLES].sort((a,b)=>b.score-a.score).slice(0,3);
    m={id:'ticket',type:'Tripla',legs:best.map(s=>({home:s.home,away:s.away,sel:s.sel,odd:s.odd,book:s.book})),
       score:Math.round(best.reduce((s,l)=>s+l.score,0)/best.length)};
  } else {
    m=MULTIPLES.find(x=>x.id===id);
  }
  if(!m)return;
  const total=multiOdd(m.legs);
  $('#sheet-content').innerHTML=`
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="closeSheet()">${icon('x',16)}</button>
    <div style="padding:20px 20px 40px">
      <div style="text-align:center;margin-bottom:24px">
        <span style="display:inline-block;font-size:.625rem;font-weight:800;padding:5px 14px;border-radius:999px;background:var(--dark);color:var(--lime);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">${m.type} · ${m.legs.length} seleções</span>
        <div style="font-size:4.5rem;font-weight:900;line-height:1;letter-spacing:-.04em;color:#fff">${total.toFixed(2)}</div>
        <div style="font-size:.75rem;color:rgba(255,255,255,.4);margin-top:8px;font-weight:500">Odd Combinada</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:0">
        ${m.legs.map((l,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:16px 0;${i<m.legs.length-1?'border-bottom:1px solid rgba(255,255,255,.06)':''}">
          <div style="width:28px;height:28px;border-radius:var(--r-sm);background:var(--dark);color:var(--lime);display:flex;align-items:center;justify-content:center;font-size:.6875rem;font-weight:900;flex-shrink:0">${i+1}</div>
          <div style="display:flex;align-items:center;gap:6px">${tc(l.home,22)}${tc(l.away,22,'away')}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:.8125rem;letter-spacing:-.01em">${l.home} vs ${l.away}</div>
            <div style="font-size:.6875rem;color:var(--lime);font-weight:700">${l.sel}</div>
          </div>
          <div style="font-size:1.375rem;font-weight:900;flex-shrink:0;letter-spacing:-.02em">${l.odd.toFixed(2)}</div>
        </div>`).join('')}
      </div>
      <div class="card bento-card--lime" style="margin-top:20px;text-align:center;padding:20px;border:none;backdrop-filter:none;-webkit-backdrop-filter:none">
        <div style="font-size:.625rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;opacity:.6">Score Médio</div>
        <div style="font-size:2.5rem;font-weight:900;line-height:1;margin-top:4px">${m.score}</div>
      </div>
    </div>`;
  $('#detail-sheet').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeSheet(){$('#detail-sheet').classList.remove('open');document.body.style.overflow=''}

/* ===== PWA ===== */
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}

/* ===== boot ===== */
function init(){
  renderPage();updateStatus();
  const sb=$('#sheet-content');let sy=0;
  sb.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
  sb.addEventListener('touchmove',e=>{if(sb.scrollTop<=0&&e.touches[0].clientY-sy>60)closeSheet()},{passive:true});
}
document.addEventListener('DOMContentLoaded',()=>{init();checkSupabase()});
</script>
</body>
</html>
