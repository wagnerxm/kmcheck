<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="NO.BLIND — Análise esportiva com modelos estatísticos">
<title>NO.BLIND</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== reset & tokens ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --lime:#C5F467;--lime-d:rgba(197,244,103,.15);--lime-dk:#9FCC3A;
  --dark:#1E2026;--dark2:#272A32;--dark3:#32353E;
  --bg:#F5F3EE;--bg2:#EDEAE4;--card:#FFFFFF;
  --border:rgba(0,0,0,.06);--border-s:rgba(0,0,0,.08);
  --success:#34C759;--success-d:rgba(52,199,89,.12);
  --danger:#FF3B30;--danger-d:rgba(255,59,48,.1);
  --warning:#FF9500;
  --txt:#1A1A1E;--muted:#6E7179;--subtle:#A0A3AB;
  --font:'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif;
  --r:20px;--r-sm:14px;--r-lg:24px;--r-xl:28px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--txt);line-height:1.5;
  overflow:hidden;height:100dvh;position:fixed;width:100%;top:0;left:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-user-select:none}
img{max-width:100%}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:4px}

/* ===== layout ===== */
#app{display:flex;height:100dvh;width:100%}
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#topbar{display:flex;align-items:center;justify-content:space-between;height:56px;
  padding:0 20px;flex-shrink:0;background:var(--bg)}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(96px + var(--safe-b))}

/* ===== bottom nav — dock flutuante premium ===== */
#bottom-nav{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(6px + var(--safe-b));
  display:flex;align-items:center;justify-content:center;z-index:50}
.bn-bar{display:flex;align-items:center;gap:4px;
  background:linear-gradient(135deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.02) 55%),rgba(24,26,28,.78);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border-radius:999px;padding:6px;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.25),
    0 14px 34px rgba(0,0,0,.45)}
.bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px 18px;border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.4);
  transition:background .2s,color .2s;-webkit-tap-highlight-color:transparent;white-space:nowrap;cursor:pointer}
.bn-item.active{background:var(--lime);color:var(--dark)}
.bn-item svg{flex-shrink:0}
.bn-item .ic{line-height:0}

/* ===== topbar ===== */
.tb-brand{display:flex;align-items:center;gap:8px}
.tb-logo{font-size:1.125rem;font-weight:800;letter-spacing:-.02em}
.tb-dot{color:var(--lime-dk)}
.tb-actions{display:flex;align-items:center;gap:8px}

/* ===== card genérico ===== */
.card{background:var(--card);border-radius:var(--r);padding:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}

/* ===== BILHETE DO DIA — card escuro hero ===== */
.ticket-hero{background:var(--dark);border-radius:var(--r-lg);padding:0;color:#fff;
  position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.ticket-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:160px;height:160px;
  border-radius:50%;background:var(--lime);opacity:.08}
.ticket-hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:100px;height:100px;
  border-radius:50%;background:var(--lime);opacity:.05}
.ticket-header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between}
.ticket-label{font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:rgba(255,255,255,.4)}
.ticket-type{font-size:.6875rem;font-weight:600;padding:4px 12px;border-radius:999px;
  background:rgba(197,244,103,.15);color:var(--lime)}
.ticket-odds-total{text-align:center;padding:20px 20px 16px}
.ticket-odds-number{font-size:3.5rem;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--lime)}
.ticket-odds-label{font-size:.6875rem;color:rgba(255,255,255,.4);margin-top:6px;text-transform:uppercase;
  letter-spacing:.08em}
/* linhas do bilhete */
.ticket-legs{border-top:1px dashed rgba(255,255,255,.1);padding:16px 20px;
  display:flex;flex-direction:column;gap:14px}
.ticket-leg{display:flex;align-items:center;gap:10px}
.ticket-leg-teams{flex:1;min-width:0}
.ticket-leg-match{font-size:.8125rem;font-weight:600;line-height:1.3}
.ticket-leg-meta{font-size:.6875rem;color:rgba(255,255,255,.4)}
.ticket-leg-pick{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ticket-leg-sel{font-size:.6875rem;font-weight:600;color:var(--lime);text-transform:uppercase}
.ticket-leg-odd{font-size:1.125rem;font-weight:800}
.ticket-footer{border-top:1px dashed rgba(255,255,255,.1);padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between}
.ticket-conf{display:flex;align-items:center;gap:6px;font-size:.6875rem;color:rgba(255,255,255,.45)}
.ticket-book{font-size:.75rem;font-weight:600;color:rgba(255,255,255,.6)}

/* ===== bet card — card branco com odd grande ===== */
.bet-card{background:var(--card);border-radius:var(--r);padding:16px;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .15s;-webkit-tap-highlight-color:transparent}
.bet-card:active{transform:scale(.985)}
.bet-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.bet-teams-col{display:flex;align-items:center}
.team-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.625rem;font-weight:700;color:#fff;flex-shrink:0;border:2px solid var(--bg)}
.team-circle.away{margin-left:-10px}
.bet-info{flex:1;min-width:0}
.bet-match{font-size:.875rem;font-weight:700;line-height:1.3}
.bet-meta{font-size:.6875rem;color:var(--subtle);margin-top:2px}
.bet-right{display:flex;flex-direction:column;align-items:flex-end}
/* odd BEM GRANDE — protagonista visual */
.bet-odd{font-size:2rem;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--dark)}
.bet-book{font-size:.625rem;color:var(--subtle);margin-top:2px;font-weight:500}
/* seleção e edge */
.bet-bottom{display:flex;align-items:center;justify-content:space-between;
  padding-top:12px;border-top:1px solid var(--border)}
.bet-sel{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:10px;
  background:var(--lime-d);font-weight:700;font-size:.75rem;color:var(--lime-dk)}
.bet-edge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:600;color:var(--muted)}
.bet-edge-val{color:var(--lime-dk);font-weight:700}

/* ===== múltipla card ===== */
.multi-card{background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent}
.multi-card:active{transform:scale(.985)}
.multi-header{display:flex;align-items:center;justify-content:space-between;padding:16px;
  border-bottom:1px solid var(--border)}
.multi-type{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  padding:4px 10px;border-radius:999px}
.multi-type--dupla{background:rgba(52,199,89,.1);color:var(--success)}
.multi-type--tripla{background:rgba(255,149,0,.1);color:var(--warning)}
.multi-type--quadra{background:rgba(197,244,103,.15);color:var(--lime-dk)}
.multi-odd{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
.multi-legs{padding:0}
.multi-leg{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--border)}
.multi-leg:last-child{border-bottom:none}
.multi-leg-info{flex:1;min-width:0}
.multi-leg-match{font-size:.8125rem;font-weight:600}
.multi-leg-pick{font-size:.6875rem;color:var(--lime-dk);font-weight:600}
.multi-leg-odd{font-size:1rem;font-weight:800}

/* ===== section ===== */
.section-label{font-size:.75rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--subtle);padding:0 4px}

/* ===== pill bar ===== */
.pill-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.pill-bar::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;padding:8px 16px;border-radius:999px;
  font-size:.8125rem;font-weight:600;background:var(--card);color:var(--muted);
  border:1.5px solid var(--border);cursor:pointer;white-space:nowrap;
  transition:all .2s;-webkit-tap-highlight-color:transparent}
.pill:active{transform:scale(.96)}
.pill.active{background:var(--dark);color:#fff;border-color:var(--dark)}

/* ===== stat pills ===== */
.stat-pill{display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:999px;font-size:.6875rem;font-weight:600}
.stat-pill--live{background:var(--success-d);color:var(--success)}
.stat-pill--offline{background:var(--danger-d);color:var(--danger)}
.stat-pill--demo{background:var(--lime-d);color:var(--lime-dk)}
.stat-pill__dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.stat-pill--live .stat-pill__dot{background:var(--success);animation:pulse 2s ease-in-out infinite}

/* ===== KPIs strip ===== */
.kpi-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.kpi-strip::-webkit-scrollbar{display:none}
.kpi-chip{flex-shrink:0;background:var(--card);border-radius:var(--r-sm);padding:10px 14px;
  text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi-chip-val{font-weight:800;font-size:1rem;line-height:1.2}
.kpi-chip-label{font-size:.5625rem;color:var(--subtle);margin-top:2px;text-transform:uppercase;
  letter-spacing:.06em;font-weight:600}

/* ===== detail sheet ===== */
#detail-sheet{position:fixed;inset:0;z-index:100;display:none;flex-direction:column}
#detail-sheet.open{display:flex}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet-body{position:absolute;bottom:0;left:0;right:0;max-height:92dvh;background:var(--bg);
  border-radius:var(--r-xl) var(--r-xl) 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:sheetUp .28s cubic-bezier(.22,1,.36,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--border-s);margin:10px auto}
.sheet-close{position:absolute;top:12px;right:12px;width:36px;height:36px;display:flex;
  align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--muted);
  background:var(--card);z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* ===== odds table (no sheet) ===== */
.odds-table{width:100%;border-collapse:separate;border-spacing:0 4px}
.odds-table th{font-size:.625rem;font-weight:700;color:var(--subtle);text-transform:uppercase;
  letter-spacing:.06em;padding:6px 8px;text-align:center}
.odds-table th:first-child{text-align:left}
.odds-table td{padding:10px;text-align:center;font-size:.8125rem;font-weight:500;
  background:var(--card);border:none}
.odds-table td:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);text-align:left;font-weight:600}
.odds-table td:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.odds-best{color:var(--lime-dk);font-weight:700;background:var(--lime-d)!important}

/* ===== model bars ===== */
.model-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.model-bar-name{font-size:.75rem;color:var(--muted);width:85px;flex-shrink:0;text-align:right;font-weight:500}
.model-bar-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.model-bar-fill{height:100%;border-radius:4px;transition:width .6s ease-out}
.model-bar-val{font-size:.75rem;font-weight:700;width:40px;flex-shrink:0}

/* ===== animações ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .35s ease-out both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== page ===== */
.page{display:none;padding:20px}
.page.active{display:block}

/* ===== util ===== */
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.text-center{text-align:center}
.hidden{display:none!important}
</style>
</head>

function tc(name,sz=32,extra=''){

  return `<div class="team-circle ${extra}" style="width:${sz}px;height:${sz}px;background:${t.c};font-size:${sz*.19}px">${t.a}</div>`;

function multiOdd(legs){return legs.reduce((a,l)=>a*l.odd,1)}

function navigate(p){currentPage=p;renderPage();updateNav();$('#content').scrollTop=0}
function updateNav(){$$('.bn-item').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage))}
function renderBottomNav(){
  const nav=$('#bottom-nav');
  let h='<div class="bn-bar">';
  PAGES.forEach(p=>{
    const on=p.id===currentPage;
    h+=`<button class="bn-item${on?' active':''}" data-page="${p.id}" onclick="navigate('${p.id}')">
      <span class="ic">${icon(p.icon,21)}</span><span>${p.label}</span></button>`;
  });
  nav.innerHTML=h+'</div>';
}
function renderPage(){
  const c=$('#content');
  switch(currentPage){
    case 'home':c.innerHTML=renderHome();break;
    case 'singles':c.innerHTML=renderSingles();break;
    case 'multiples':c.innerHTML=renderMultiples();break;
    case 'stats':c.innerHTML=renderStats();break;
    default:c.innerHTML=renderHome();
  }
  renderBottomNav();
}

  return `<div class="multi-card" onclick="openMultiSheet('${m.id}')">

/* ========================================================
   SHEET — detalhe do single
   ======================================================== */
function openSheet(id){
  const s=SINGLES.find(x=>x.id===id);if(!s)return;
  const models=Object.entries(s.models);
  const maxP=Math.max(...models.map(m=>m[1]));
  const bookNames=Object.keys(s.odds);
  const bestVal=Math.max(...Object.values(s.odds));

  $('#sheet-content').innerHTML=`
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="closeSheet()">${icon('x',16)}</button>
    <div style="padding:20px 20px 36px">
      <!-- cabeçalho -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        ${tc(s.home,38)}${tc(s.away,38,'away')}
        <div style="flex:1">
          <div style="font-weight:800;font-size:1rem">${s.home} vs ${s.away}</div>
          <div style="font-size:.75rem;color:var(--subtle)">${s.league} · Hoje ${s.time}</div>
        </div>
      </div>

      <!-- ODD GIGANTE -->
      <div class="card" style="text-align:center;padding:24px;margin-bottom:16px;border:2px solid var(--lime-d)">
        <div style="font-size:.6875rem;color:var(--subtle);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:8px">${s.market}</div>
        <div style="font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--dark)">${s.odd.toFixed(2)}</div>
        <div style="margin-top:10px;display:inline-flex;align-items:center;gap:4px;padding:6px 16px;border-radius:999px;background:var(--lime-d);color:var(--lime-dk);font-weight:700;font-size:.8125rem">
          ${icon('check',14)} ${s.sel}
        </div>
        <div style="font-size:.75rem;color:var(--subtle);margin-top:8px">${s.book} · Melhor odd disponível</div>
      </div>

      <!-- KPIs -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
        <div class="card text-center" style="padding:12px"><div style="font-size:1.125rem;font-weight:800;color:var(--lime-dk)">+${s.edge.toFixed(1)}%</div><div style="font-size:.5625rem;color:var(--subtle);margin-top:2px;text-transform:uppercase;font-weight:600">Edge</div></div>
        <div class="card text-center" style="padding:12px"><div style="font-size:1.125rem;font-weight:800">${(s.fairP*100).toFixed(1)}%</div><div style="font-size:.5625rem;color:var(--subtle);margin-top:2px;text-transform:uppercase;font-weight:600">Prob. Justa</div></div>
        <div class="card text-center" style="padding:12px"><div style="font-size:1.125rem;font-weight:800;color:var(--warning)">${s.score}</div><div style="font-size:.5625rem;color:var(--subtle);margin-top:2px;text-transform:uppercase;font-weight:600">Score</div></div>
      </div>

      <!-- modelos -->
      <div class="section-label" style="margin-bottom:10px">PROBABILIDADE POR MODELO</div>
      <div style="margin-bottom:16px">
        ${models.map(([name,prob])=>{
          const pct=(prob*100).toFixed(1);const w=(prob/maxP)*100;
          const isE=name==='Ensemble';
          return `<div class="model-bar">
            <div class="model-bar-name" style="font-weight:${isE?'700':'500'}">${name}</div>
            <div class="model-bar-track"><div class="model-bar-fill" style="width:${w}%;background:${isE?'var(--lime)':'var(--subtle)'}"></div></div>

      <!-- odds por casa -->

      <div style="overflow-x:auto">
        <table class="odds-table">
          <thead><tr><th>Casa</th><th>Odd</th></tr></thead>
          <tbody>${bookNames.map(b=>{
            const v=s.odds[b];const best=v===bestVal;
            return `<tr><td>${b}</td><td class="${best?'odds-best':''}">${v.toFixed(2)}${best?' ★':''}</td></tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;
  $('#detail-sheet').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeSheet(){$('#detail-sheet').classList.remove('open');document.body.style.overflow=''}

/* ===== PWA ===== */
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}

/* ===== boot ===== */
function init(){
  renderPage();updateStatus();
  const sb=$('#sheet-content');let sy=0;
  sb.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
  sb.addEventListener('touchmove',e=>{if(sb.scrollTop<=0&&e.touches[0].clientY-sy>60)closeSheet()},{passive:true});
}
document.addEventListener('DOMContentLoaded',()=>{init();checkSupabase()});
</script>
</body>
</html>
