<title>Painel de Documentos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">

<style>
/* ── Tokens ── */
:root {
  --accent: #3B7A6B;
  --accent-hover: #327063;
  --accent-subtle: rgba(59,122,107,.10);
  --amber: #D0943A;
  --amber-subtle: rgba(208,148,58,.10);
  --bg: #F6F3ED;
  --surface: #EDEAE3;
  --card: #FFFFFF;
  --card-hover: #FDFCFA;
  --text: #2A2D33;
  --text-2: #7C808A;
  --text-3: #A8ABB3;
  --border: #DDD9D1;
  --border-light: #E8E5DE;
  --shadow-sm: 0 1px 3px rgba(42,45,51,.05);
  --shadow-md: 0 3px 12px rgba(42,45,51,.08);
  --radius: 10px;
  --radius-sm: 6px;
  --danger: #C4453A;
  --status-pendente: #B8BBC3;
  --status-enviado: #D0943A;
  --status-aprovado: #3B7A6B;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1F25;--surface:#23262D;--card:#2A2E36;--card-hover:#31353E;
    --text:#E2E0DA;--text-2:#9B9EA6;--text-3:#6D717A;
    --border:#383C44;--border-light:#30343C;
    --shadow-sm:0 1px 3px rgba(0,0,0,.15);--shadow-md:0 3px 12px rgba(0,0,0,.22);
    --accent-subtle:rgba(59,122,107,.16);--amber-subtle:rgba(208,148,58,.14);
    --status-pendente:#5A5E66;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1F25;--surface:#23262D;--card:#2A2E36;--card-hover:#31353E;
  --text:#E2E0DA;--text-2:#9B9EA6;--text-3:#6D717A;
  --border:#383C44;--border-light:#30343C;
  --shadow-sm:0 1px 3px rgba(0,0,0,.15);--shadow-md:0 3px 12px rgba(0,0,0,.22);
  --accent-subtle:rgba(59,122,107,.16);--amber-subtle:rgba(208,148,58,.14);
  --status-pendente:#5A5E66;
}

/* ── Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'DM Sans','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ── Header ── */
.header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:16px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.header-icon{
  width:36px;height:36px;border-radius:8px;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.header h1{
  font-size:20px;font-weight:700;letter-spacing:-.3px;flex:1;min-width:140px;
}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:34px;height:34px;border:none;border-radius:var(--radius-sm);
  background:transparent;color:var(--text-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;
}
.icon-btn:hover{background:var(--accent-subtle);color:var(--text)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Painel de documentos solicitados ── */
.docs-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.docs-bar-label{
  font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-2);flex-shrink:0;
}
.doc-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.doc-chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:13px;font-weight:500;padding:4px 10px 4px 12px;
  border-radius:20px;background:var(--card);border:1px solid var(--border);
  color:var(--text);transition:border-color .12s;
}
.doc-chip:hover{border-color:var(--text-3)}
.doc-chip-x{
  width:18px;height:18px;border:none;border-radius:50%;
  background:transparent;color:var(--text-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  transition:background .1s,color .1s;line-height:1;
}
.doc-chip-x:hover{background:rgba(196,69,58,.12);color:var(--danger)}
.add-doc-btn{
  font-family:inherit;font-size:13px;font-weight:500;
  padding:4px 14px;border:1px dashed var(--border);border-radius:20px;
  background:transparent;color:var(--text-3);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  transition:border-color .12s,color .12s;
}
.add-doc-btn:hover{border-color:var(--accent);color:var(--accent)}
.add-doc-input{
  font-family:inherit;font-size:13px;padding:4px 12px;
  border:1px solid var(--accent);border-radius:20px;
  background:var(--card);color:var(--text);outline:none;width:180px;
}

/* ── Resumo ── */
.summary{
  padding:16px 24px;display:flex;gap:20px;flex-wrap:wrap;
}
.stat{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--text-2);
}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stat b{font-weight:600;color:var(--text)}

/* ── Grid de pastas ── */
.grid{
  padding:8px 24px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
  align-items:start;
}

/* ── Pasta (card) ── */
.folder{
  background:var(--card);border:1px solid var(--border-light);
  border-radius:var(--radius);overflow:hidden;
  transition:box-shadow .12s;
}
.folder:hover{box-shadow:var(--shadow-md)}
.folder-header{
  padding:14px 16px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border-light);
}
.folder-color{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
}
.folder-name{
  font-weight:600;font-size:15px;flex:1;min-width:0;
  background:none;border:1px solid transparent;border-radius:4px;
  padding:2px 6px;color:var(--text);outline:none;cursor:pointer;
  font-family:inherit;transition:border-color .12s,background .12s;
  text-overflow:ellipsis;overflow:hidden;white-space:nowrap;
}
.folder-name:hover{background:var(--accent-subtle)}
.folder-name:focus{border-color:var(--accent);background:var(--bg);cursor:text}
.folder-progress{
  font-size:11px;font-weight:600;color:var(--text-3);flex-shrink:0;
  padding:2px 8px;border-radius:10px;background:var(--surface);
}
.folder-progress.complete{background:var(--accent-subtle);color:var(--accent)}
.folder-menu{
  width:26px;height:26px;border:none;border-radius:4px;
  background:transparent;color:var(--text-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  flex-shrink:0;transition:background .1s,color .1s;
}
.folder-menu:hover{background:var(--accent-subtle);color:var(--text)}

/* Lista de documentos dentro da pasta */
.doc-list{padding:6px 0}
.doc-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;cursor:pointer;
  transition:background .08s;
}
.doc-row:hover{background:var(--surface)}
.doc-status{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s;
}
.doc-status[data-s="pendente"]{
  border:2px solid var(--status-pendente);background:transparent;
}
.doc-status[data-s="enviado"]{
  border:2px solid var(--status-enviado);background:var(--amber-subtle);
}
.doc-status[data-s="enviado"]::after{
  content:'';width:8px;height:8px;border-radius:50%;background:var(--status-enviado);
}
.doc-status[data-s="aprovado"]{
  border:2px solid var(--status-aprovado);background:var(--status-aprovado);
}
.doc-status[data-s="aprovado"]::after{
  content:'';width:10px;height:8px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translateY(-1px);
}
.doc-name{
  font-size:14px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.doc-row[data-s="aprovado"] .doc-name{color:var(--text-2);text-decoration:line-through}
.doc-status-label{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;
  flex-shrink:0;
}
.doc-status-label[data-s="pendente"]{color:var(--status-pendente)}
.doc-status-label[data-s="enviado"]{color:var(--status-enviado)}
.doc-status-label[data-s="aprovado"]{color:var(--status-aprovado)}

/* Barra de progresso */
.folder-bar{
  margin:0 16px 14px;height:4px;border-radius:2px;background:var(--surface);
  overflow:hidden;
}
.folder-bar-fill{
  height:100%;border-radius:2px;background:var(--accent);
  transition:width .25s ease;
}

/* ── Adicionar pessoa ── */
.add-person{
  border:2px dashed var(--border);border-radius:var(--radius);
  background:transparent;color:var(--text-3);cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;
  padding:40px 20px;display:flex;flex-direction:column;
  align-items:center;gap:8px;
  transition:border-color .12s,color .12s,background .12s;
  min-height:160px;justify-content:center;
}
.add-person:hover{
  border-color:var(--accent);color:var(--accent);background:var(--accent-subtle);
}
.add-person svg{opacity:.6}

/* ── Dropdown ── */
.dropdown{
  position:fixed;z-index:500;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-md);
  min-width:160px;padding:4px;
  animation:dropIn .1s ease;
}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.dd-item{
  display:block;width:100%;padding:8px 12px;
  border:none;border-radius:4px;background:none;
  font-family:inherit;font-size:13px;color:var(--text);
  cursor:pointer;text-align:left;transition:background .08s;
}
.dd-item:hover{background:var(--accent-subtle)}
.dd-item.danger{color:var(--danger)}
.dd-item.danger:hover{background:rgba(196,69,58,.08)}

/* ── Legenda ── */
.legend{
  padding:4px 24px 16px;display:flex;gap:16px;flex-wrap:wrap;
  font-size:12px;color:var(--text-3);
}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}

/* ── Vazio ── */
.empty-state{
  text-align:center;padding:60px 24px;color:var(--text-3);
}
.empty-state p{font-size:14px;margin-top:8px}

/* ── Responsive ── */
@media(max-width:600px){
  .header{padding:14px 16px}
  .docs-bar{padding:12px 16px}
  .summary{padding:12px 16px}
  .grid{padding:4px 16px 32px;grid-template-columns:1fr}
  .legend{padding:4px 16px 12px}
}

/* ── Focus ── */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Motion ── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<!-- Header -->
<header class="header">
  <div class="header-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </svg>
  </div>
  <h1>Documentos da Equipe</h1>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<!-- Documentos solicitados -->
<div class="docs-bar">
  <span class="docs-bar-label">Solicitados:</span>
  <div class="doc-chips" id="docChips"></div>
</div>

<!-- Legenda -->
<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="border:2px solid var(--status-pendente)"></div> Pendente
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="border:2px solid var(--status-enviado);background:var(--amber-subtle)">
      <div style="width:6px;height:6px;border-radius:50%;background:var(--status-enviado)"></div>
    </div> Enviado
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--status-aprovado)">
      <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5 6 5 8.5 9.5 3.5"/></svg>
    </div> Aprovado
  </div>
</div>

<!-- Resumo -->
<div class="summary" id="summary"></div>

<!-- Grid -->
<div class="grid" id="grid"></div>

<script>
/* ══════════════════════════════════════
   Painel de Documentos da Equipe
   ══════════════════════════════════════ */

const STORAGE = 'painel-docs';
const COLORS = ['#3B7A6B','#7B5CC4','#C4713B','#3B82C4','#C4453A','#2B8A5E','#8B6B3B','#5E3B7A','#3B6B8A','#8A5E3B'];

let data = null;
let idN = Date.now();
function nid(){ return 'i'+(idN++) }

/* ── Dados padrão ── */
function defaults(){
  return {
    docs:[
      {id:nid(),name:'RG'},
      {id:nid(),name:'CPF'},
      {id:nid(),name:'Comprovante de Residência'},
      {id:nid(),name:'Atestado Médico'},
    ],
    members:[
      {id:nid(),name:'Maria Silva',color:COLORS[0],statuses:{}},
      {id:nid(),name:'João Costa',color:COLORS[1],statuses:{}},
      {id:nid(),name:'Ana Souza',color:COLORS[2],statuses:{}},
    ]
  }
}

/* ── Persistência ── */
function save(){ try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(STORAGE);
    if(raw){data=JSON.parse(raw);return}
  }catch(e){}
  data=defaults();
  /* Gerar alguns status de exemplo */
  const d=data.docs;
  const m=data.members;
  if(d.length>=3&&m.length>=3){
    m[0].statuses[d[0].id]='aprovado';
    m[0].statuses[d[1].id]='aprovado';
    m[0].statuses[d[2].id]='enviado';
    m[1].statuses[d[0].id]='enviado';
    m[2].statuses[d[0].id]='aprovado';
    m[2].statuses[d[1].id]='enviado';
    m[2].statuses[d[2].id]='enviado';
    m[2].statuses[d[3].id]='aprovado';
  }
  save();
}

function getStatus(member,docId){
  return member.statuses[docId]||'pendente';
}
function cycleStatus(current){
  if(!current||current==='pendente') return 'enviado';
  if(current==='enviado') return 'aprovado';
  return 'pendente';
}

/* ── Render: chips dos documentos ── */
function renderDocChips(){
  const wrap=document.getElementById('docChips');
  wrap.innerHTML='';

  for(const doc of data.docs){
    const chip=document.createElement('span');
    chip.className='doc-chip';
    chip.innerHTML=`${esc(doc.name)}<button class="doc-chip-x" title="Remover" aria-label="Remover ${esc(doc.name)}">×</button>`;
    chip.querySelector('.doc-chip-x').onclick=()=>{
      if(!confirm(`Remover "${doc.name}" da lista de documentos solicitados?`)) return;
      data.docs=data.docs.filter(d=>d.id!==doc.id);
      /* Limpar status órfãos */
      for(const m of data.members) delete m.statuses[doc.id];
      save(); render();
    };
    wrap.appendChild(chip);
  }

  /* Botão de adicionar */
  const addBtn=document.createElement('button');
  addBtn.className='add-doc-btn';
  addBtn.innerHTML='+ Novo';
  addBtn.onclick=()=>showAddDoc(addBtn);
  wrap.appendChild(addBtn);
}

let addingDoc=false;
function showAddDoc(btn){
  if(addingDoc) return;
  addingDoc=true;
  btn.hidden=true;

  const input=document.createElement('input');
  input.className='add-doc-input';
  input.placeholder='Nome do documento…';
  btn.parentNode.insertBefore(input,btn);
  input.focus();

  function close(){
    input.remove();
    btn.hidden=false;
    addingDoc=false;
  }
  function submit(){
    const name=input.value.trim();
    if(name){
      data.docs.push({id:nid(),name});
      save(); render();
    } else { close() }
  }

  input.onkeydown=(e)=>{
    if(e.key==='Enter'){e.preventDefault();submit()}
    if(e.key==='Escape') close();
  };
  input.onblur=()=>setTimeout(close,100);
}

/* ── Render: resumo ── */
function renderSummary(){
  const wrap=document.getElementById('summary');
  const total=data.members.length*data.docs.length;
  let pendente=0,enviado=0,aprovado=0;
  for(const m of data.members)
    for(const d of data.docs){
      const s=getStatus(m,d.id);
      if(s==='aprovado') aprovado++;
      else if(s==='enviado') enviado++;
      else pendente++;
    }

  if(total===0){wrap.innerHTML='';return}

  wrap.innerHTML=`
    <div class="stat"><div class="stat-dot" style="background:var(--status-pendente)"></div><b>${pendente}</b> pendente${pendente!==1?'s':''}</div>
    <div class="stat"><div class="stat-dot" style="background:var(--status-enviado)"></div><b>${enviado}</b> enviado${enviado!==1?'s':''}</div>
    <div class="stat"><div class="stat-dot" style="background:var(--status-aprovado)"></div><b>${aprovado}</b> aprovado${aprovado!==1?'s':''}</div>
  `;
}

/* ── Render: grid de pastas ── */
function renderGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';

  if(data.members.length===0 && data.docs.length===0){
    grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="color:var(--text-3);opacity:.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><p>Adicione documentos e pessoas para começar</p></div>';
  }

  for(const member of data.members){
    grid.appendChild(renderFolder(member));
  }

  /* Botão de adicionar pessoa */
  const addBtn=document.createElement('button');
  addBtn.className='add-person';
  addBtn.innerHTML=`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Adicionar pessoa`;
  addBtn.onclick=addPerson;
  grid.appendChild(addBtn);
}

function renderFolder(member){
  const el=document.createElement('div');
  el.className='folder';

  /* Contagem */
  const approved=data.docs.filter(d=>getStatus(member,d.id)==='aprovado').length;
  const total=data.docs.length;
  const pct=total?Math.round(approved/total*100):0;
  const allDone=total>0&&approved===total;

  /* Header */
  const header=document.createElement('div');
  header.className='folder-header';

  const dot=document.createElement('div');
  dot.className='folder-color';
  dot.style.background=member.color;

  const nameInput=document.createElement('input');
  nameInput.className='folder-name';
  nameInput.value=member.name;
  nameInput.spellcheck=false;
  nameInput.maxLength=40;
  nameInput.onblur=()=>{member.name=nameInput.value.trim()||member.name;save()};
  nameInput.onkeydown=(e)=>{if(e.key==='Enter')nameInput.blur()};

  const progress=document.createElement('span');
  progress.className='folder-progress'+(allDone?' complete':'');
  progress.textContent=`${approved}/${total}`;

  const menuBtn=document.createElement('button');
  menuBtn.className='folder-menu';
  menuBtn.innerHTML='⋯';
  menuBtn.title='Opções';
  menuBtn.onclick=(e)=>{e.stopPropagation();showFolderMenu(member.id,menuBtn)};

  header.append(dot,nameInput,progress,menuBtn);

  /* Lista de docs */
  const list=document.createElement('div');
  list.className='doc-list';

  if(data.docs.length===0){
    const empty=document.createElement('div');
    empty.style.cssText='padding:16px;text-align:center;color:var(--text-3);font-size:13px';
    empty.textContent='Nenhum documento solicitado';
    list.appendChild(empty);
  }

  for(const doc of data.docs){
    const s=getStatus(member,doc.id);
    const row=document.createElement('div');
    row.className='doc-row';
    row.dataset.s=s;
    row.title=`Clique para alterar: ${s==='pendente'?'→ Enviado':s==='enviado'?'→ Aprovado':'→ Pendente'}`;
    row.onclick=()=>{
      const cur=getStatus(member,doc.id);
      const next=cycleStatus(cur);
      if(next==='pendente') delete member.statuses[doc.id];
      else member.statuses[doc.id]=next;
      save(); render();
    };

    const statusDot=document.createElement('div');
    statusDot.className='doc-status';
    statusDot.dataset.s=s;

    const name=document.createElement('span');
    name.className='doc-name';
    name.textContent=doc.name;

    const label=document.createElement('span');
    label.className='doc-status-label';
    label.dataset.s=s;
    label.textContent=s==='pendente'?'Pendente':s==='enviado'?'Enviado':'Aprovado';

    row.append(statusDot,name,label);
    list.appendChild(row);
  }

  /* Barra de progresso */
  const bar=document.createElement('div');
  bar.className='folder-bar';
  const fill=document.createElement('div');
  fill.className='folder-bar-fill';
  fill.style.width=pct+'%';
  bar.appendChild(fill);

  el.append(header,list,bar);
  return el;
}

/* ── Adicionar pessoa ── */
function addPerson(){
  const name=prompt('Nome da pessoa:');
  if(!name||!name.trim()) return;
  const color=COLORS[data.members.length%COLORS.length];
  data.members.push({id:nid(),name:name.trim(),color,statuses:{}});
  save(); render();
}

/* ── Menu da pasta ── */
let activeDd=null;
function closeDd(){if(activeDd){activeDd.remove();activeDd=null}document.removeEventListener('click',closeDd)}

function showFolderMenu(memberId,anchor){
  closeDd();
  const rect=anchor.getBoundingClientRect();
  const dd=document.createElement('div');
  dd.className='dropdown';
  dd.style.top=rect.bottom+4+'px';
  dd.style.left=Math.min(rect.left,window.innerWidth-180)+'px';

  const items=[
    {label:'✏️ Renomear',action:()=>{
      closeDd();
      const el=document.querySelector(`.folder-name`);
      /* Encontrar o input correto */
      const folders=document.querySelectorAll('.folder');
      for(const f of folders){
        const inp=f.querySelector('.folder-name');
        if(inp){
          const m=data.members.find(m=>m.name===inp.value);
          if(m&&m.id===memberId){inp.focus();inp.select();break}
        }
      }
    }},
    {label:'✅ Marcar todos como aprovado',action:()=>{
      closeDd();
      const m=data.members.find(m=>m.id===memberId);
      if(!m) return;
      for(const d of data.docs) m.statuses[d.id]='aprovado';
      save();render();
    }},
    {label:'↩️ Resetar status',action:()=>{
      closeDd();
      const m=data.members.find(m=>m.id===memberId);
      if(!m) return;
      if(!confirm(`Resetar todos os status de "${m.name}"?`)) return;
      m.statuses={};save();render();
    }},
    {label:'🗑️ Remover pessoa',cls:'danger',action:()=>{
      closeDd();
      const m=data.members.find(m=>m.id===memberId);
      if(!m||!confirm(`Remover "${m.name}" do painel?`)) return;
      data.members=data.members.filter(m=>m.id!==memberId);
      save();render();
    }},
  ];

  for(const item of items){
    const btn=document.createElement('button');
    btn.className='dd-item'+(item.cls?' '+item.cls:'');
    btn.textContent=item.label;
    btn.onclick=(e)=>{e.stopPropagation();item.action()};
    dd.appendChild(btn);
  }

  document.body.appendChild(dd);
  activeDd=dd;
  requestAnimationFrame(()=>document.addEventListener('click',closeDd));
}

/* ── Tema ── */
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement;
  const next=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',next);
  try{localStorage.setItem('painel-theme',next)}catch(e){}
};
try{
  const t=localStorage.getItem('painel-theme');
  if(t) document.documentElement.setAttribute('data-theme',t);
}catch(e){}

/* ── Utilitários ── */
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

/* ── Render geral ── */
function render(){
  renderDocChips();
  renderSummary();
  renderGrid();
}

/* ── Inicialização ── */
load();
render();
</script>
