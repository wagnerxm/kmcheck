<title>Painel de Documentos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<style>
/* ── Tokens ── */
:root {
  --forest: #2D6A4F;
  --forest-dim: rgba(45,106,79,.08);
  --sand: #D4A373;
  --sand-dim: rgba(212,163,115,.08);
  --sage: #40916C;
  --sage-dim: rgba(64,145,108,.08);
  --honey: #DDA15E;
  --honey-dim: rgba(221,161,94,.08);
  --brick: #BC4749;
  --brick-dim: rgba(188,71,73,.08);
  --bg: #F8F5F0;
  --surface: #FFFFFF;
  --surface-2: #F2EEE8;
  --text: #1A2C1F;
  --text-2: #6B7B6F;
  --text-3: #9BA89E;
  --border: #DED8CE;
  --border-light: #EBE7E0;
  --shadow-sm: 0 1px 2px rgba(26,44,31,.04);
  --shadow-md: 0 4px 16px rgba(26,44,31,.06);
  --shadow-lg: 0 8px 32px rgba(26,44,31,.10);
  --glow: rgba(45,106,79,.08);
  --radius: 12px;
  --radius-sm: 8px;
  --ring-track: #DED8CE;
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12170F;--surface:#1C231A;--surface-2:#252D22;
    --text:#E2E0DA;--text-2:#9BA89E;--text-3:#6B7B6F;
    --border:#2D3429;--border-light:#232B20;
    --shadow-sm:0 1px 2px rgba(0,0,0,.25);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 8px 32px rgba(0,0,0,.45);
    --glow:rgba(45,106,79,.15);
    --forest-dim:rgba(45,106,79,.16);
    --sand-dim:rgba(212,163,115,.12);
    --sage-dim:rgba(64,145,108,.14);
    --honey-dim:rgba(221,161,94,.12);
    --brick-dim:rgba(188,71,73,.12);
    --ring-track:#2D3429;
  }
}
:root[data-theme="dark"]{
  --bg:#12170F;--surface:#1C231A;--surface-2:#252D22;
  --text:#E2E0DA;--text-2:#9BA89E;--text-3:#6B7B6F;
  --border:#2D3429;--border-light:#232B20;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 8px 32px rgba(0,0,0,.45);
  --glow:rgba(45,106,79,.15);
  --forest-dim:rgba(45,106,79,.16);
  --sand-dim:rgba(212,163,115,.12);
  --sage-dim:rgba(64,145,108,.14);
  --honey-dim:rgba(221,161,94,.12);
  --brick-dim:rgba(188,71,73,.12);
  --ring-track:#2D3429;
}

/* ── Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ── Shell ── */
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 48px}

/* ── Header ── */
.hdr{padding:36px 0 0}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hdr-title h1{
  font-family:'DM Serif Display',Georgia,'Times New Roman',serif;
  font-weight:400;font-size:30px;line-height:1.15;
  letter-spacing:-.3px;
  background:linear-gradient(135deg,var(--forest),var(--sand));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.hdr-title p{color:var(--text-2);font-size:14px;margin-top:4px;font-weight:500}
.hdr-actions{display:flex;gap:8px;align-items:center;padding-top:4px}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;box-shadow:var(--shadow-sm);
}
.icon-btn:hover{border-color:var(--forest);color:var(--forest);box-shadow:0 0 0 3px var(--forest-dim)}
.export-btn{
  width:auto;padding:0 14px;gap:6px;font-family:inherit;
  font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
}

/* ── Busca ── */
.search-row{margin:16px 0 0}
.search-wrap{position:relative;max-width:360px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search-input{
  width:100%;padding:9px 12px 9px 38px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);
  font-family:inherit;font-size:14px;font-weight:500;
  transition:border-color .15s,box-shadow .15s;
  box-shadow:var(--shadow-sm);
}
.search-input:focus{border-color:var(--forest);box-shadow:0 0 0 3px var(--forest-dim);outline:none}
.search-input::placeholder{color:var(--text-3);font-weight:400}

/* ── Overview ── */
.overview{
  margin:24px 0 0;padding:20px;
  background:var(--surface);border:1px solid var(--border-light);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
}
.ov-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ov-title{font-size:13px;font-weight:700;color:var(--text-2)}
.ov-pct{font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--text)}
.ov-bar{
  display:flex;height:10px;border-radius:5px;overflow:hidden;
  background:var(--surface-2);
}
/* 2px surface gap entre segmentos empilhados (mark spec dataviz) */
.ov-seg+.ov-seg{border-left:2px solid var(--surface)}
.ov-seg{transition:width .6s cubic-bezier(.4,0,.2,1);min-width:0}
.ov-labels{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.ov-lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-2)}
.ov-lbl i{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:block}

/* ── Stats ── */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin:16px 0 0;
}
.stat-card{
  background:var(--surface);border:1px solid var(--border-light);
  border-radius:var(--radius);padding:16px 18px;
  display:flex;align-items:center;gap:12px;
  transition:box-shadow .2s,border-color .2s;
}
.stat-card:hover{box-shadow:var(--shadow-md)}
.stat-icon{
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.stat-value{
  font-weight:800;font-size:26px;
  letter-spacing:-.5px;line-height:1;
  font-variant-numeric:tabular-nums;
}
.stat-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ── Docs bar ── */
.docs-section{margin:24px 0 0}
.section-label{
  font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.8px;color:var(--text-3);
  margin-bottom:8px;
}
.doc-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.doc-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;padding:7px 12px 7px 14px;
  border-radius:8px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);transition:all .15s;box-shadow:var(--shadow-sm);
}
.doc-chip:hover{border-color:var(--forest);box-shadow:0 0 0 3px var(--forest-dim)}
.chip-x{
  width:20px;height:20px;border:none;border-radius:50%;
  background:var(--surface-2);color:var(--text-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;line-height:1;transition:all .12s;
}
.chip-x:hover{background:var(--brick-dim);color:var(--brick)}
.add-chip{
  font-family:inherit;font-size:13px;font-weight:600;
  padding:7px 16px;border:1px dashed var(--border);border-radius:8px;
  background:transparent;color:var(--text-3);cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;transition:all .15s;
}
.add-chip:hover{border-color:var(--forest);color:var(--forest);background:var(--forest-dim)}
.add-chip-input{
  font-family:inherit;font-size:13px;font-weight:600;
  padding:7px 14px;border:1.5px solid var(--forest);border-radius:8px;
  background:var(--surface);color:var(--text);outline:none;width:200px;
  box-shadow:0 0 0 3px var(--forest-dim);
}

/* ── Controls: legenda + ordenação ── */
.controls{
  display:flex;justify-content:space-between;align-items:center;
  margin:20px 0 0;flex-wrap:wrap;gap:12px;
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--text-3)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sort{display:flex;align-items:center;gap:6px}
.sort-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px}
.sort-btn{
  font-family:inherit;font-size:12px;font-weight:600;
  padding:5px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);color:var(--text-2);cursor:pointer;
  display:flex;align-items:center;gap:4px;transition:all .12s;
}
.sort-btn:hover{border-color:var(--forest);color:var(--forest)}
.sort-btn.active{background:var(--forest-dim);border-color:var(--forest);color:var(--forest)}
.sort-arrow{font-size:10px;opacity:.4;font-weight:400}
.sort-btn.active .sort-arrow{opacity:1}

/* ── Grid ── */
.grid-section{margin:20px 0 0}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;align-items:start;
}

/* ── Folder card ── */
.folder{
  background:var(--surface);border:1px solid var(--border-light);
  border-radius:var(--radius);overflow:hidden;
  position:relative;isolation:isolate;
  transition:box-shadow .25s ease,transform .2s ease;
  animation:cardIn .4s ease both;
}
.folder::before{
  content:'';position:absolute;inset:-1.5px;
  border-radius:calc(var(--radius) + 1.5px);
  background:linear-gradient(135deg,var(--forest),var(--sand));
  z-index:-1;opacity:0;transition:opacity .3s ease;
}
.folder:hover{box-shadow:0 8px 28px var(--glow);transform:translateY(-2px)}
.folder:hover::before{opacity:1}
@keyframes cardIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

.folder-top{padding:18px 18px 14px;display:flex;align-items:center;gap:12px}
.avatar{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px;
  box-shadow:0 3px 10px rgba(0,0,0,.12);
}
.folder-info{flex:1;min-width:0}
.folder-name{
  font-weight:700;font-size:15px;line-height:1.3;color:var(--text);
  background:none;border:1px solid transparent;border-radius:6px;
  padding:2px 6px;margin:-2px -6px;outline:none;cursor:pointer;
  font-family:inherit;width:calc(100% + 12px);
  transition:border-color .15s,background .15s;
  text-overflow:ellipsis;overflow:hidden;white-space:nowrap;
}
.folder-name:hover{background:var(--forest-dim)}
.folder-name:focus{border-color:var(--forest);background:var(--surface-2);cursor:text}
.folder-sub{font-size:12px;color:var(--text-3);margin-top:2px;padding-left:6px;font-weight:500}
.folder-menu{
  width:28px;height:28px;border:none;border-radius:6px;
  background:transparent;color:var(--text-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  flex-shrink:0;transition:all .12s;
}
.folder-menu:hover{background:var(--forest-dim);color:var(--forest)}

/* Progress ring */
.ring-wrap{
  position:relative;width:50px;height:50px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--ring-track);stroke-width:4}
.ring-fill{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.ring-pct{
  position:absolute;font-weight:700;font-size:12px;
  letter-spacing:-.3px;color:var(--text);font-variant-numeric:tabular-nums;
}

/* ── Doc list ── */
.doc-list{padding:0 10px 10px}
.doc-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 8px;border-radius:var(--radius-sm);cursor:pointer;
  transition:background .1s;
}
.doc-row:hover{background:var(--surface-2)}
.doc-row+.doc-row{border-top:1px solid var(--border-light)}
.doc-row:hover+.doc-row{border-top-color:transparent}

.s-dot{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .2s ease;
}
.s-dot[data-s="pendente"]{border:2px solid var(--text-3);background:transparent}
.s-dot[data-s="enviado"]{border:2px solid var(--honey);background:var(--honey-dim)}
.s-dot[data-s="enviado"]::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--honey)}
.s-dot[data-s="aprovado"]{border:none;background:var(--sage)}

.doc-row-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-row[data-s="aprovado"] .doc-row-name{color:var(--text-3);text-decoration:line-through}

.s-badge{
  font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;flex-shrink:0;transition:all .15s;
}
.s-badge[data-s="pendente"]{background:var(--surface-2);color:var(--text-3)}
.s-badge[data-s="enviado"]{background:var(--honey-dim);color:var(--honey)}
.s-badge[data-s="aprovado"]{background:var(--sage-dim);color:var(--sage)}

/* ── Add person card ── */
.add-person{
  border:2px dashed var(--border);border-radius:var(--radius);
  background:transparent;color:var(--text-3);cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;
  padding:48px 20px;display:flex;flex-direction:column;
  align-items:center;gap:10px;justify-content:center;
  transition:all .2s;min-height:200px;width:100%;
}
.add-person:hover{border-color:var(--forest);color:var(--forest);background:var(--forest-dim);transform:translateY(-2px)}
.add-person svg{opacity:.4;transition:opacity .2s}
.add-person:hover svg{opacity:.7}

/* ── Empty state (busca sem resultado) ── */
.empty-state{
  grid-column:1/-1;text-align:center;padding:60px 24px;
  color:var(--text-3);
}
.empty-state svg{margin-bottom:12px;opacity:.3}
.empty-state p{font-size:14px;font-weight:500}
.empty-state .empty-hint{font-size:12px;margin-top:4px;color:var(--text-3)}

/* ── Toast ── */
.toasts{position:fixed;bottom:20px;right:20px;z-index:900;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  padding:11px 18px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--toast-accent,var(--forest));
  box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:600;color:var(--text);
  transform:translateX(16px);opacity:0;
  transition:all .25s ease;pointer-events:auto;
}
.toast.show{transform:translateX(0);opacity:1}

/* ── Dropdown ── */
.dropdown{
  position:fixed;z-index:600;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);
  min-width:180px;padding:4px;animation:ddIn .12s ease;
}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.dd-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;
  border:none;border-radius:6px;background:none;
  font-family:inherit;font-size:13px;font-weight:500;color:var(--text);
  cursor:pointer;text-align:left;transition:background .08s;
}
.dd-item:hover{background:var(--forest-dim)}
.dd-item.danger{color:var(--brick)}
.dd-item.danger:hover{background:var(--brick-dim)}
.dd-item svg{flex-shrink:0;width:16px;height:16px}

/* ── Responsive ── */
@media(max-width:768px){
  .wrap{padding:0 16px 40px}
  .hdr{padding:24px 0 0}
  .hdr-title h1{font-size:24px}
  .search-wrap{max-width:100%}
  .overview{padding:16px}
  .ov-pct{font-size:18px}
  .stats{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat-card{padding:12px 14px;gap:10px}
  .stat-value{font-size:20px}
  .stat-icon{width:34px;height:34px;border-radius:8px}
  .controls{flex-direction:column;align-items:flex-start}
  .grid{grid-template-columns:1fr;gap:12px}
  .folder-top{padding:14px}
  .doc-list{padding:0 8px 8px}
  .toasts{left:16px;right:16px;bottom:16px}
}
@media(max-width:400px){
  .stats{grid-template-columns:1fr 1fr}
  .stat-label{font-size:10px}
  .doc-chips{gap:6px}
  .ov-labels{gap:10px}
  .sort{flex-wrap:wrap}
}

/* ── Focus ── */
:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
/* ── Motion ── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<div class="wrap">
  <!-- Header -->
  <header class="hdr">
    <div class="hdr-top">
      <div class="hdr-title">
        <h1>Documentos da Equipe</h1>
        <p>Acompanhe os documentos solicitados de cada membro</p>
      </div>
      <div class="hdr-actions">
        <button class="icon-btn export-btn" id="exportBtn" title="Exportar CSV" aria-label="Exportar" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Exportar</span>
        </button>
        <button class="icon-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
    <!-- Busca -->
    <div class="search-row">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
        <input type="search" id="searchInput" class="search-input" placeholder="Buscar pessoa…" autocomplete="off">
      </div>
    </div>
  </header>

  <!-- Overview — barra de progresso geral -->
  <div class="overview" id="overview"></div>

  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- Docs solicitados -->
  <div class="docs-section">
    <div class="section-label">Documentos Solicitados</div>
    <div class="doc-chips" id="docChips"></div>
  </div>

  <!-- Legenda + ordenação -->
  <div class="controls">
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="border:2px solid var(--text-3)"></div>Pendente
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="border:2px solid var(--honey);background:var(--honey-dim)">
          <div style="width:6px;height:6px;border-radius:50%;background:var(--honey)"></div>
        </div>Enviado
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--sage)">
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5 6 5 8.5 9.5 3.5"/></svg>
        </div>Aprovado
      </div>
    </div>
    <div class="sort" id="sortBtns">
      <span class="sort-label">Ordenar</span>
      <button class="sort-btn" data-sort="name">Nome <span class="sort-arrow">↕</span></button>
      <button class="sort-btn" data-sort="progress">Progresso <span class="sort-arrow">↕</span></button>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid-section">
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Toasts -->
<div class="toasts" id="toasts"></div>

<script>
/* ═══════════════════════════════════════════
   Painel de Documentos — Natureza Luxe v4
   ═══════════════════════════════════════════ */

const STORAGE='painel-docs-v3';
const GRADIENTS=[
  ['#2D6A4F','#40916C'],  // floresta→sálvia
  ['#D4A373','#BC4749'],  // camel→terracota
  ['#40916C','#588157'],  // sálvia→oliva
  ['#DDA15E','#D4A373'],  // mel→camel
  ['#588157','#2D6A4F'],  // oliva→floresta
  ['#BC4749','#D4A373'],  // terracota→camel
  ['#2D6A4F','#D4A373'],  // floresta→camel
  ['#40916C','#DDA15E'],  // sálvia→mel
  ['#D4A373','#588157'],  // camel→oliva
  ['#DDA15E','#BC4749'],  // mel→terracota
];
const RING_R=22, RING_C=2*Math.PI*RING_R;

let data=null, idN=Date.now();
let searchQ='', sortBy='', sortDir=1;
function nid(){return 'i'+(idN++)}

/* ── Defaults ── */
function defaults(){
  const d={
    docs:[
      {id:nid(),name:'RG'},{id:nid(),name:'CPF'},
      {id:nid(),name:'Comprovante de Residência'},
      {id:nid(),name:'Atestado Médico'},
    ],
    members:[
      {id:nid(),name:'Maria Silva',gi:0,statuses:{}},
      {id:nid(),name:'João Costa',gi:1,statuses:{}},
      {id:nid(),name:'Ana Souza',gi:2,statuses:{}},
    ]
  };
  const docs=d.docs, m=d.members;
  if(docs.length>=4&&m.length>=3){
    m[0].statuses[docs[0].id]='aprovado';
    m[0].statuses[docs[1].id]='aprovado';
    m[0].statuses[docs[2].id]='enviado';
    m[1].statuses[docs[0].id]='enviado';
    m[2].statuses[docs[0].id]='aprovado';
    m[2].statuses[docs[1].id]='enviado';
    m[2].statuses[docs[2].id]='enviado';
    m[2].statuses[docs[3].id]='aprovado';
  }
  return d;
}

/* ── Persistência ── */
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){}}
function load(){
  try{const r=localStorage.getItem(STORAGE);if(r){data=JSON.parse(r);return}}catch(e){}
  data=defaults();save();
}

function getS(m,did){return m.statuses[did]||'pendente'}
function cycle(s){return s==='pendente'?'enviado':s==='enviado'?'aprovado':'pendente'}
function initials(name){return name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

/* ── Toast ── */
function toast(msg,type){
  const t=document.createElement('div');
  t.className='toast';
  if(type) t.style.setProperty('--toast-accent',`var(--${type})`);
  t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2400);
}

/* ═════ Render ═════ */

function render(){
  renderOverview();
  renderStats();
  renderChips();
  renderGrid();
}

/* ── Overview: barra empilhada de progresso geral ── */
function renderOverview(){
  const el=document.getElementById('overview');
  const total=data.members.length*data.docs.length;
  if(!total){el.innerHTML='<div class="ov-head"><span class="ov-title">Progresso Geral</span><span class="ov-pct">—</span></div>';return}
  let pend=0,env=0,aprov=0;
  for(const m of data.members)
    for(const d of data.docs){
      const s=getS(m,d.id);
      if(s==='aprovado') aprov++;
      else if(s==='enviado') env++;
      else pend++;
    }
  const pctA=(aprov/total*100),pctE=(env/total*100),pctP=(pend/total*100);
  const pctTotal=Math.round(pctA);
  el.innerHTML=`
    <div class="ov-head">
      <span class="ov-title">Progresso Geral</span>
      <span class="ov-pct">${pctTotal}%</span>
    </div>
    <div class="ov-bar">
      ${pctA?`<div class="ov-seg" style="width:${pctA.toFixed(1)}%;background:var(--sage)"></div>`:''}
      ${pctE?`<div class="ov-seg" style="width:${pctE.toFixed(1)}%;background:var(--honey)"></div>`:''}
      ${pctP?`<div class="ov-seg" style="width:${pctP.toFixed(1)}%;background:var(--border)"></div>`:''}
    </div>
    <div class="ov-labels">
      <span class="ov-lbl"><i style="background:var(--sage)"></i>Aprovado ${aprov}</span>
      <span class="ov-lbl"><i style="background:var(--honey)"></i>Enviado ${env}</span>
      <span class="ov-lbl"><i style="background:var(--border)"></i>Pendente ${pend}</span>
    </div>
  `;
}

/* ── Stats ── */
function renderStats(){
  const el=document.getElementById('stats');
  const total=data.members.length*data.docs.length;
  let pend=0,env=0,aprov=0;
  for(const m of data.members)
    for(const d of data.docs){
      const s=getS(m,d.id);
      if(s==='aprovado') aprov++;
      else if(s==='enviado') env++;
      else pend++;
    }
  el.innerHTML=`
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--forest-dim)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--forest)" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div><div class="stat-value" style="color:var(--forest)">${data.members.length}</div><div class="stat-label">Pessoas</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--surface-2)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <div><div class="stat-value">${pend}</div><div class="stat-label">Pendentes</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--honey-dim)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--honey)" stroke-width="2" stroke-linecap="round"><path d="M12 2v4"/><path d="M12 18v4"/><circle cx="12" cy="12" r="6"/></svg>
      </div>
      <div><div class="stat-value" style="color:var(--honey)">${env}</div><div class="stat-label">Enviados</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--sage-dim)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div><div class="stat-value" style="color:var(--sage)">${aprov}</div><div class="stat-label">Aprovados</div></div>
    </div>
  `;
}

/* ── Doc chips ── */
let addingDoc=false;
function renderChips(){
  const wrap=document.getElementById('docChips');
  wrap.innerHTML='';
  for(const doc of data.docs){
    const chip=document.createElement('span');
    chip.className='doc-chip';
    chip.innerHTML=`${esc(doc.name)}<button class="chip-x" title="Remover" aria-label="Remover ${esc(doc.name)}">×</button>`;
    chip.querySelector('.chip-x').onclick=()=>{
      if(!confirm(`Remover "${doc.name}" da lista?`)) return;
      data.docs=data.docs.filter(d=>d.id!==doc.id);
      for(const m of data.members) delete m.statuses[doc.id];
      save();render();
      toast('Documento removido','brick');
    };
    wrap.appendChild(chip);
  }
  const addBtn=document.createElement('button');
  addBtn.className='add-chip';
  addBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Novo`;
  addBtn.onclick=()=>showAddDoc(addBtn);
  wrap.appendChild(addBtn);
}

function showAddDoc(btn){
  if(addingDoc) return;
  addingDoc=true;btn.hidden=true;
  const input=document.createElement('input');
  input.className='add-chip-input';
  input.placeholder='Nome do documento…';
  btn.parentNode.insertBefore(input,btn);
  input.focus();
  function close(){input.remove();btn.hidden=false;addingDoc=false}
  function submit(){
    const n=input.value.trim();
    if(n){data.docs.push({id:nid(),name:n});save();render();toast('Documento adicionado','forest')}
    else close();
  }
  input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}if(e.key==='Escape')close()};
  input.onblur=()=>setTimeout(close,120);
}

/* ── Grid (com busca e ordenação) ── */
function renderGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';

  let members=[...data.members];

  /* Filtro de busca */
  if(searchQ){
    const q=searchQ.toLowerCase();
    members=members.filter(m=>m.name.toLowerCase().includes(q));
  }

  /* Ordenação */
  if(sortBy==='name'){
    members.sort((a,b)=>sortDir*a.name.localeCompare(b.name,'pt-BR'));
  } else if(sortBy==='progress'){
    members.sort((a,b)=>{
      const pA=data.docs.length?data.docs.filter(d=>getS(a,d.id)==='aprovado').length/data.docs.length:0;
      const pB=data.docs.length?data.docs.filter(d=>getS(b,d.id)==='aprovado').length/data.docs.length:0;
      return sortDir*(pA-pB);
    });
  }

  /* Nenhum resultado */
  if(!members.length){
    const empty=document.createElement('div');
    empty.className='empty-state';
    if(searchQ){
      empty.innerHTML=`
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
        <p>Nenhum resultado para "${esc(searchQ)}"</p>
        <div class="empty-hint">Tente outro termo de busca</div>`;
    } else {
      empty.innerHTML=`
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/>
        </svg>
        <p>Nenhuma pessoa cadastrada</p>
        <div class="empty-hint">Clique no botão abaixo para adicionar</div>`;
    }
    grid.appendChild(empty);
  }

  members.forEach((member,i)=>{
    const card=renderFolder(member,i);
    card.style.animationDelay=(i*50)+'ms';
    grid.appendChild(card);
  });

  /* Botão de adicionar — só mostra fora da busca */
  if(!searchQ){
    const addBtn=document.createElement('button');
    addBtn.className='add-person';
    addBtn.innerHTML=`<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/><line x1="12" y1="17" x2="12" y2="23"/><line x1="9" y1="20" x2="15" y2="20"/></svg>Adicionar pessoa`;
    addBtn.onclick=addPerson;
    grid.appendChild(addBtn);
  }
}

function renderFolder(member,idx){
  const el=document.createElement('div');
  el.className='folder';

  const aprov=data.docs.filter(d=>getS(member,d.id)==='aprovado').length;
  const total=data.docs.length;
  const pct=total?Math.round(aprov/total*100):0;
  const grad=GRADIENTS[member.gi!=null?member.gi%GRADIENTS.length:idx%GRADIENTS.length];

  /* ── Top section ── */
  const top=document.createElement('div');
  top.className='folder-top';

  const av=document.createElement('div');
  av.className='avatar';
  av.style.background=`linear-gradient(135deg,${grad[0]},${grad[1]})`;
  av.textContent=initials(member.name);

  const info=document.createElement('div');
  info.className='folder-info';
  const nameInput=document.createElement('input');
  nameInput.className='folder-name';
  nameInput.value=member.name;
  nameInput.spellcheck=false;
  nameInput.maxLength=40;
  nameInput.onblur=()=>{
    const v=nameInput.value.trim();
    if(v&&v!==member.name){member.name=v;save();render();toast('Nome atualizado','forest')}
  };
  nameInput.onkeydown=e=>{if(e.key==='Enter')nameInput.blur()};
  const sub=document.createElement('div');
  sub.className='folder-sub';
  sub.textContent=total?`${aprov} de ${total} documento${total!==1?'s':''}`:' ';
  info.append(nameInput,sub);

  const ringWrap=document.createElement('div');
  ringWrap.className='ring-wrap';
  const offset=RING_C*(1-pct/100);
  ringWrap.innerHTML=`
    <svg width="50" height="50" viewBox="0 0 52 52">
      <defs><linearGradient id="rg${member.id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${grad[0]}"/>
        <stop offset="100%" stop-color="${grad[1]}"/>
      </linearGradient></defs>
      <circle class="ring-track" cx="26" cy="26" r="${RING_R}"/>
      <circle class="ring-fill" cx="26" cy="26" r="${RING_R}"
        stroke="url(#rg${member.id})"
        stroke-dasharray="${RING_C}"
        stroke-dashoffset="${offset}"/>
    </svg>
    <span class="ring-pct">${pct}%</span>
  `;

  const menuBtn=document.createElement('button');
  menuBtn.className='folder-menu';
  menuBtn.innerHTML='⋯';
  menuBtn.title='Opções';
  menuBtn.onclick=e=>{e.stopPropagation();showMenu(member.id,menuBtn)};

  top.append(av,info,ringWrap,menuBtn);

  const list=document.createElement('div');
  list.className='doc-list';
  if(!data.docs.length){
    const empty=document.createElement('div');
    empty.style.cssText='padding:20px;text-align:center;color:var(--text-3);font-size:13px;font-weight:500';
    empty.textContent='Nenhum documento solicitado';
    list.appendChild(empty);
  }
  for(const doc of data.docs){
    const s=getS(member,doc.id);
    const row=document.createElement('div');
    row.className='doc-row';
    row.dataset.s=s;
    row.title=`Clique: ${s==='pendente'?'→ Enviado':s==='enviado'?'→ Aprovado':'→ Pendente'}`;
    row.onclick=()=>{
      const cur=getS(member,doc.id);
      const next=cycle(cur);
      if(next==='pendente') delete member.statuses[doc.id];
      else member.statuses[doc.id]=next;
      save();render();
      const labels={enviado:'Enviado',aprovado:'Aprovado',pendente:'Pendente'};
      const types={enviado:'honey',aprovado:'sage',pendente:''};
      toast(`${doc.name} → ${labels[next]}`,types[next]);
    };

    const dot=document.createElement('div');
    dot.className='s-dot';
    dot.dataset.s=s;
    if(s==='aprovado'){
      dot.innerHTML='<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5 6 5 8.5 9.5 3.5"/></svg>';
    }

    const name=document.createElement('span');
    name.className='doc-row-name';
    name.textContent=doc.name;

    const badge=document.createElement('span');
    badge.className='s-badge';
    badge.dataset.s=s;
    badge.textContent=s==='pendente'?'Pendente':s==='enviado'?'Enviado':'Aprovado';

    row.append(dot,name,badge);
    list.appendChild(row);
  }

  el.append(top,list);
  return el;
}

/* ── Add person ── */
function addPerson(){
  const name=prompt('Nome da pessoa:');
  if(!name||!name.trim()) return;
  const gi=data.members.length%GRADIENTS.length;
  data.members.push({id:nid(),name:name.trim(),gi,statuses:{}});
  save();render();
  toast(`${name.trim()} adicionado(a)`,'forest');
}

/* ── Dropdown menu ── */
let activeDd=null;
function closeDd(){if(activeDd){activeDd.remove();activeDd=null}document.removeEventListener('click',closeDd)}
function showMenu(mid,anchor){
  closeDd();
  const rect=anchor.getBoundingClientRect();
  const dd=document.createElement('div');
  dd.className='dropdown';
  dd.style.top=rect.bottom+6+'px';
  dd.style.left=Math.min(rect.right-180,window.innerWidth-196)+'px';

  const items=[
    {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
     label:'Renomear',action:()=>{closeDd();const els=[...document.querySelectorAll('.folder')];for(const f of els){const inp=f.querySelector('.folder-name');if(inp){const m=data.members.find(x=>x.name===inp.value);if(m&&m.id===mid){inp.focus();inp.select();break}}}}},
    {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
     label:'Aprovar todos',action:()=>{closeDd();const m=data.members.find(x=>x.id===mid);if(!m)return;for(const d of data.docs)m.statuses[d.id]='aprovado';save();render();toast(`Todos aprovados para ${m.name}`,'sage')}},
    {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
     label:'Resetar status',action:()=>{closeDd();const m=data.members.find(x=>x.id===mid);if(!m||!confirm(`Resetar todos os status de "${m.name}"?`))return;m.statuses={};save();render();toast('Status resetado','honey')}},
    {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
     label:'Remover pessoa',cls:'danger',action:()=>{closeDd();const m=data.members.find(x=>x.id===mid);if(!m||!confirm(`Remover "${m.name}" do painel?`))return;data.members=data.members.filter(x=>x.id!==mid);save();render();toast(`${m.name} removido(a)`,'brick')}},
  ];

  for(const item of items){
    const btn=document.createElement('button');
    btn.className='dd-item'+(item.cls?' '+item.cls:'');
    btn.innerHTML=item.icon+'<span>'+item.label+'</span>';
    btn.onclick=e=>{e.stopPropagation();item.action()};
    dd.appendChild(btn);
  }
  document.body.appendChild(dd);
  activeDd=dd;
  requestAnimationFrame(()=>document.addEventListener('click',closeDd));
}

/* ── Busca ── */
document.getElementById('searchInput').oninput=function(){
  searchQ=this.value.trim();
  renderGrid();
};

/* ── Ordenação ── */
document.getElementById('sortBtns').onclick=function(e){
  const btn=e.target.closest('.sort-btn');
  if(!btn) return;
  const by=btn.dataset.sort;
  if(sortBy===by){
    /* mesmo botão: inverte direção ou desativa */
    if(sortDir===1) sortDir=-1;
    else { sortBy=''; sortDir=1; }
  } else {
    sortBy=by; sortDir=1;
  }
  /* atualiza visual dos botões */
  document.querySelectorAll('.sort-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.sort===sortBy);
    const arrow=b.querySelector('.sort-arrow');
    if(b.dataset.sort===sortBy) arrow.textContent=sortDir===1?'↑':'↓';
    else arrow.textContent='↕';
  });
  renderGrid();
};

/* ── Theme ── */
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement;
  const next=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',next);
  try{localStorage.setItem('painel-theme-v3',next)}catch(e){}
};
try{const t=localStorage.getItem('painel-theme-v3');document.documentElement.setAttribute('data-theme',t||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}

/* ── Keyboard ── */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDd();document.getElementById('searchInput').blur()}
  /* Ctrl/Cmd+F → foca a busca */
  if((e.ctrlKey||e.metaKey)&&e.key==='f'){
    const si=document.getElementById('searchInput');
    /* só intercepta se o search não está focado */
    if(document.activeElement!==si){e.preventDefault();si.focus();si.select()}
  }
});

/* ── Downloads (capability do artefato) ── */
(async()=>{
  try{
    if(typeof claude==='undefined'||!claude.use) return;
    const dl=await claude.use('downloads');
    if(!dl) return;
    const btn=document.getElementById('exportBtn');
    btn.hidden=false;
    btn.onclick=async()=>{
      /* gera CSV com BOM para acentos no Excel */
      const BOM='﻿';
      const rows=['"Pessoa","Documento","Status"'];
      for(const m of data.members)
        for(const d of data.docs){
          const s=getS(m,d.id);
          const label=s==='pendente'?'Pendente':s==='enviado'?'Enviado':'Aprovado';
          rows.push(`"${m.name}","${d.name}","${label}"`);
        }
      try{
        await dl.save({filename:'equipe-documentos.csv',data:BOM+rows.join('\r\n')});
        toast('Relatório exportado','sage');
      }catch(e){if(e.code!=='cancelled') toast('Erro ao exportar','brick')}
    };
  }catch(e){}
})();

/* ── Init ── */
load();
render();
</script>
